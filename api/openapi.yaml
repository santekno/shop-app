openapi: 3.1.0
info:
  title: GoShop API
  version: 0.1.0
  summary: The single REST API behind the GoShop storefront, admin dashboard and mobile app.
  description: |
    GoShop is the online store built in the Santekno Fullstack Course. This
    contract is written before the code: the API in `apps/api` (Bab 2+) must
    match it, and the web and mobile clients are typed from it.

    Conventions:
    - JSON everywhere, field names in `snake_case`.
    - Money is an integer amount of rupiah plus a currency, never a float.
    - Lists use cursor pagination: pass `page.next_cursor` back as `cursor`
      until it is `null`.
    - Every error uses the same body: `{"error":{"code","message","details"}}`,
      where `details` is optional. Unknown routes and wrong methods use it too
      (404 `NOT_FOUND`, 405 `METHOD_NOT_ALLOWED` with an `Allow` header): Bab 2
      sets chi's `NotFound` and `MethodNotAllowed` handlers to the same JSON
      error writer.
    - Any endpoint except the health probes may answer 503 `TIMEOUT` with the
      same body when a request runs past the server's time limit
      (`APP_REQUEST_TIMEOUT`, 15s by default). Retry later.
    - Text in a JSON body must be valid UTF-8 without NUL characters; a
      string that is not answers 400 `VALIDATION_FAILED`. One exception: a
      raw invalid UTF-8 byte inside a JSON string is accepted, because Go's
      JSON decoder replaces it with U+FFFD (the replacement character)
      before the API validates the value, so the stored text holds U+FFFD
      instead.
    - Every response carries `X-Content-Type-Options: nosniff`,
      `Content-Security-Policy: default-src 'none'; frame-ancestors 'none'`,
      `X-Frame-Options: DENY`, `Referrer-Policy: no-referrer` and
      `Cache-Control: no-store`, plus `Strict-Transport-Security` outside
      development.
    - Every response carries `X-Request-ID`: the caller's value when it is
      1-128 characters of `A-Za-z0-9._:-`, otherwise a generated one. Quote
      it when reporting a problem; the server logs carry the same ID.
  license:
    name: MIT
    identifier: MIT
  contact:
    name: Santekno
    url: https://www.santekno.com/series/fullstack-goshop/
servers:
  - url: http://localhost:8080
    description: Local development (make up)
security: []
tags:
  - name: Health
    description: Liveness and readiness probes for Docker and Railway.
  - name: Catalog
    description: Public, read-only catalog for buyers. No authentication needed.
  - name: Auth
    description: |
      Accounts and tokens (Bab 4, design in ADR 0005). Passwords are hashed
      with argon2id and never logged or returned.
  - name: Me
    description: The logged-in user's own account. Every operation needs an access token.
  - name: Admin


    description: |
      Product and order management for the admin dashboard. Every operation needs an
      access token whose role is `seller` or `admin` (Bab 4): no token is
      401 `UNAUTHORIZED`, a `buyer` is 403 `FORBIDDEN`.
  - name: Cart
    description: |
      The shopping cart (Bab 5, ADR 0006). With an access token every
      operation works on the user's cart (one per user); without one, on
      the guest cart named by the `X-Cart-Token` header. A guest's first
      `POST /v1/cart/items` creates the guest cart and returns its token
      once. After logging in, the client calls `POST /v1/cart/merge` with
      the token and forgets it. Every operation answers with the whole
      cart. The cart never reserves stock; checkout re-validates every line.
  - name: Checkout
    description: |
      Turning the cart into an order (Bab 5, ADR 0006). The buyer must be
      logged in. Every line is re-validated against the catalog: its
      variant must still be for sale, in stock, and at the price the buyer
      saw.
  - name: Orders
    description: |
      A buyer's orders (Bab 5, ADR 0006). An order copies what it sells
      (name, variant, SKU, price) and where it ships, so later catalog or
      address changes never alter it. Every operation is scoped to the
      caller: another user's order answers 404 like a missing one.

paths:
  /healthz:
    get:
      tags: [Health]
      operationId: getHealthz
      summary: Liveness probe
      description: Returns 200 while the process is running. It checks no dependencies, so a database outage does not restart the container.
      responses:
        "200":
          description: The process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
              example:
                status: ok
        "503":
          $ref: "#/components/responses/Unavailable"

  /readyz:
    get:
      tags: [Health]
      operationId: getReadyz
      summary: Readiness probe
      description: |
        Returns 200 when every readiness check passes, 503 otherwise. Load
        balancers stop sending traffic while it fails.

        Checks: `server` fails from the moment the API receives SIGTERM
        until it exits, so traffic drains before shutdown; `postgres` (Bab 3)
        fails while a ping through the connection pool fails or takes longer
        than 2s; `redis` (Bab 4) fails while a PING to Redis fails, because
        authenticated requests and rate limits need it. The probes run outside the request
        timeout, so they never answer 503 `TIMEOUT`.
      responses:
        "200":
          description: Every readiness check passes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
              example:
                status: ok
                checks:
                  server: { status: ok, duration_ms: 0 }
                  postgres: { status: ok, duration_ms: 1 }
                  redis: { status: ok, duration_ms: 0 }
        "503":
          $ref: "#/components/responses/Unavailable"

  /v1/categories:
    get:
      tags: [Catalog]
      operationId: listCategories
      summary: List categories
      description: Returns every category, parents before children, sorted by name. The list is small, so it is not paginated.
      responses:
        "200":
          description: All categories.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryList"
              example:
                data:
                  - id: 0192f3a0-1c2d-7b4e-8a10-3f5e6d7c8b90
                    slug: pakaian
                    name: Pakaian
                    parent_id: null
                  - id: 0192f3a0-1c2d-7b4e-8a10-3f5e6d7c8b91
                    slug: kaos
                    name: Kaos
                    parent_id: 0192f3a0-1c2d-7b4e-8a10-3f5e6d7c8b90
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/products:
    get:
      tags: [Catalog]
      operationId: listProducts
      summary: List and search products
      description: Returns active products, one page at a time. Filters can be combined. To get the next page, send the same filters plus `cursor` set to the previous `page.next_cursor`.
      parameters:
        - name: category
          in: query
          description: Category slug. Products in its child categories are included. A slug that names no category returns 400 `UNKNOWN_CATEGORY`, so a typo is not mistaken for an empty category.
          schema:
            type: string
            pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
            maxLength: 100
          example: kaos
        - name: q
          in: query
          description: |
            Search text, matched against product name and description with
            PostgreSQL full-text search (Indonesian stemming, so `dipakai`
            also finds `pakai`; a match in the name counts more). Accepts
            words, `"quoted phrases"`, `-excluded` words and `or`; it never
            fails on syntax. Combines with `category`, `sort` and `cursor`;
            results follow `sort`, not relevance. Text that is only spaces is
            no search.
          schema:
            type: string
            minLength: 1
            maxLength: 100
          example: kaos polos
        - name: sort
          in: query
          description: Sort order. Price sorting uses the cheapest sellable variant (`price_from`).
          schema:
            type: string
            enum: [newest, price_asc, price_desc]
            default: newest
        - name: cursor
          in: query
          description: Opaque cursor from `page.next_cursor` of the previous page. Omit it for the first page. Clients must not parse or build it; it is only valid with the same `category`, `q` and `sort`.
          schema:
            type: string
            maxLength: 512
        - name: limit
          in: query
          description: Page size.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: One page of products.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductList"
              example:
                data:
                  - id: 0192f3a1-5e6f-7a8b-9c0d-1e2f3a4b5c6d
                    slug: kaos-polos-hitam
                    name: Kaos Polos Hitam
                    description: Kaos katun combed 30s, nyaman dipakai sehari-hari.
                    category:
                      id: 0192f3a0-1c2d-7b4e-8a10-3f5e6d7c8b91
                      slug: kaos
                      name: Kaos
                      parent_id: 0192f3a0-1c2d-7b4e-8a10-3f5e6d7c8b90
                    price_from: { amount: 89000, currency: IDR }
                    in_stock: true
                    variants:
                      - id: 0192f3a1-5e6f-7a8b-9c0d-1e2f3a4b5c70
                        sku: KPH-M
                        name: M
                        price: { amount: 89000, currency: IDR }
                        stock: 12
                      - id: 0192f3a1-5e6f-7a8b-9c0d-1e2f3a4b5c71
                        sku: KPH-XL
                        name: XL
                        price: { amount: 99000, currency: IDR }
                        stock: 0
                    created_at: "2026-11-01T08:00:00Z"
                page:
                  next_cursor: eyJjIjoiMjAyNi0xMS0wMVQwODowMDowMFoiLCJpZCI6IjAxOTJmM2ExIn0
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/products/{slug}:
    get:
      tags: [Catalog]
      operationId: getProduct
      summary: Get one product
      description: Returns an active product with its sellable (non-archived) variants. A slug that does not match the slug pattern returns 404 `NOT_FOUND`, exactly like a slug that matches no product, so clients handle one case.
      parameters:
        - name: slug
          in: path
          required: true
          description: Product slug.
          schema:
            type: string
            pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
            maxLength: 200
          example: kaos-polos-hitam
      responses:
        "200":
          description: The product.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductDetail"
              example:
                data:
                  id: 0192f3a1-5e6f-7a8b-9c0d-1e2f3a4b5c6d
                  slug: kaos-polos-hitam
                  name: Kaos Polos Hitam
                  description: Kaos katun combed 30s, nyaman dipakai sehari-hari.
                  category:
                    id: 0192f3a0-1c2d-7b4e-8a10-3f5e6d7c8b91
                    slug: kaos
                    name: Kaos
                    parent_id: 0192f3a0-1c2d-7b4e-8a10-3f5e6d7c8b90
                  price_from: { amount: 89000, currency: IDR }
                  in_stock: true
                  variants:
                    - id: 0192f3a1-5e6f-7a8b-9c0d-1e2f3a4b5c70
                      sku: KPH-M
                      name: M
                      price: { amount: 89000, currency: IDR }
                      stock: 12
                  created_at: "2026-11-01T08:00:00Z"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/admin/products:
    post:
      tags: [Admin]
      operationId: createProduct
      security:
        - bearerAuth: []
      summary: Create a product with its variants
      description: |
        The product and its
        variants are stored in one transaction, and `price_from` is computed
        from the variants in the same transaction. SKUs are trimmed and
        upper-cased before they are stored. Variants must not carry an `id`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductWrite"
      responses:
        "201":
          description: The product was created.
          headers:
            Location:
              description: URL of the new product, `/v1/admin/products/{id}`.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminProductDetail"
        "400":
          $ref: "#/components/responses/BadWrite"
        "409":
          $ref: "#/components/responses/Conflict"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/admin/products/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Product ID. One that is not a UUID returns 404 `NOT_FOUND`.
        schema:
          type: string
          format: uuid
    get:
      tags: [Admin]
      operationId: getAdminProduct
      security:
        - bearerAuth: []
      summary: Get any product
      description: Returns the product whatever its status, with its sellable (non-archived) variants.
      responses:
        "200":
          description: The product.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminProductDetail"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      tags: [Admin]
      operationId: updateProduct
      security:
        - bearerAuth: []
      summary: Save a product and its variants
      description: |
        The body is the whole product, as an
        admin form sends it. A variant with an `id` (a sellable variant of
        this product) is updated, one without an `id` is added, and a
        sellable variant left out of the list is archived (kept for order
        history, never deleted; its SKU stays taken). Everything runs in one
        transaction that also recomputes `price_from`.

        **Optimistic locking (Bab 5, ADR 0006):** every existing variant
        must carry the `version` it was loaded with (`GET
        /v1/admin/products/{id}`). If anything changed the variant since (a
        checkout took stock, another admin saved), nothing is saved and the
        answer is 409 `VERSION_CONFLICT` naming the variant: reload and save
        again. Without the check, a form that stayed open would overwrite
        the stock buyers had just taken.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductWrite"
      responses:
        "200":
          description: The saved product.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminProductDetail"
        "400":
          $ref: "#/components/responses/BadWrite"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags: [Admin]
      operationId: archiveProduct
      security:
        - bearerAuth: []
      summary: Archive a product
      description: |
        Sets the status to `archived`, which
        takes the product off the storefront. Nothing is deleted: orders
        keep pointing at the product and its variants, and saving it again
        with another status restores it. Archiving an archived product
        answers 204 as well.
      responses:
        "204":
          description: The product is archived.
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/auth/register:
    post:
      tags: [Auth]
      operationId: register
      summary: Create an account
      description: |
        Rate limited: 10 per hour per client IP (429 `RATE_LIMITED`).

        Creates a `buyer` account. The email is trimmed and lower-cased, and
        must be plain ASCII. The password must be 8 to 128 characters and
        not one of the most common leaked passwords; there are no rules
        about digits or symbols (NIST SP 800-63B). Every invalid field is
        reported at once. The account can log in straight away; its email
        is unverified until the user confirms it with the token from the
        verification email (`/v1/auth/verify-email`).

        An email that already has an account answers 409 `EMAIL_TAKEN`.
        This tells a caller that the address is registered, a deliberate
        trade-off for a clear sign-up form; the endpoint is rate limited.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
            example:
              email: budi@example.com
              password: kopi-susu-gula-aren
              name: Budi Santoso
      responses:
        "201":
          description: The account was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserDetail"
        "400":
          $ref: "#/components/responses/BadAuthRequest"
        "409":
          $ref: "#/components/responses/EmailTaken"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Log in with email and password
      description: |
        Rate limited: 20 per 15 minutes per client IP and 5 per 15 minutes per email (429 `RATE_LIMITED`).

        Returns a short-lived access token (a JWT, `APP_ACCESS_TOKEN_TTL`,
        15 minutes by default) to send as `Authorization: Bearer <token>`.

        Every failure is 401 `INVALID_CREDENTIALS`: an unknown email, a
        wrong password, an account that signs in with Google only, and a
        deleted account all look the same, and take the same time (one
        argon2id verification each), so the endpoint does not reveal which
        emails have an account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            example:
              email: budi@example.com
              password: kopi-susu-gula-aren
      responses:
        "200":
          description: Logged in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPairDetail"
        "400":
          $ref: "#/components/responses/BadAuthRequest"
        "401":
          $ref: "#/components/responses/InvalidCredentials"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshTokens
      summary: Rotate the refresh token
      description: |
        Rate limited: 60 per 15 minutes per client IP (429 `RATE_LIMITED`).

        Exchanges a refresh token for a new access token and a new refresh
        token of the same session. The presented refresh token never works
        again. Presenting one that was already rotated means someone else
        has a copy: the API revokes the whole session (every token issued
        since that login) and answers 401 `TOKEN_INVALID`, and the user logs
        in again. Clients must not refresh in parallel; keep one refresh in
        flight and let other requests wait for it.

        The access token carries the user's role as it is now, so a role
        change takes effect at the next refresh.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: New tokens.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPairDetail"
        "400":
          $ref: "#/components/responses/BadAuthRequest"
        "401":
          $ref: "#/components/responses/InvalidRefreshToken"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: End the session
      description: |
        Revokes the session of the refresh token: the refresh token stops
        working, and so does every access token of the session, from the
        next request on (the session is marked revoked in Redis for one
        access-token lifetime). No access token is
        needed, so a client whose access token has expired can still log
        out. Answers 204 whether or not the token was still valid.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "204":
          description: The session is over.
        "400":
          $ref: "#/components/responses/BadAuthRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/me:
    get:
      tags: [Me]
      operationId: getMe
      summary: Get my account
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The caller's account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      tags: [Me]
      operationId: updateMe
      summary: Update my profile
      description: Changes the name and the phone number. A field left out keeps its value; `phone` set to `null` removes it. The email cannot be changed yet (a new address would need verifying first).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfilePatch"
            example:
              name: Budi Santoso
              phone: "081234567890"
      responses:
        "200":
          description: The updated account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserDetail"
        "400":
          $ref: "#/components/responses/BadMeRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags: [Me]
      operationId: deleteMe
      summary: Delete my account
      description: |
        Deletes the account by anonymising it (orders keep pointing at it):
        the email becomes `deleted+<id>@invalid`, the name, phone and
        password are removed, the addresses, Google sign-in link and email
        tokens are deleted, and every session ends. The email is free to
        register again. This cannot be undone.
      security:
        - bearerAuth: []
      responses:
        "204":
          description: The account is deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/me/addresses:
    get:
      tags: [Me]
      operationId: listAddresses
      summary: List my addresses
      description: Every address of the caller, the default first, then the newest. At most 20, so the list is not paginated.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The caller's addresses.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddressList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [Me]
      operationId: createAddress
      summary: Add an address
      description: |
        The first address is the default whatever `is_default` says. A new
        address with `is_default: true` becomes the default and the old one
        stops being it. A user keeps exactly one default while they have
        any address, and at most 20 addresses (409
        `ADDRESS_LIMIT_REACHED`).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddressCreate"
            example:
              label: Rumah
              recipient_name: Budi Santoso
              phone: "081234567890"
              street: Jl. Merdeka No. 10, RT 01/RW 02
              city: Bandung
              province: Jawa Barat
              postal_code: "40111"
              is_default: true
      responses:
        "201":
          description: The address was added.
          headers:
            Location:
              description: URL of the new address, `/v1/me/addresses/{id}`.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddressDetail"
        "400":
          $ref: "#/components/responses/BadMeRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/AddressConflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/me/addresses/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Address ID. Another user's address, and an ID that is not a UUID, answer 404 `NOT_FOUND` exactly like a missing one.
        schema:
          type: string
          format: uuid
    get:
      tags: [Me]
      operationId: getAddress
      summary: Get one of my addresses
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The address.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddressDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      tags: [Me]
      operationId: updateAddress
      summary: Change one of my addresses
      description: A field left out (or `null`) keeps its value. `is_default` true makes this the default; false on the default address answers 409 `DEFAULT_ADDRESS_REQUIRED` (make another address the default instead).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddressPatch"
      responses:
        "200":
          description: The updated address.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddressDetail"
        "400":
          $ref: "#/components/responses/BadMeRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/AddressConflict"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags: [Me]
      operationId: deleteAddress
      summary: Delete one of my addresses
      description: When it was the default, the newest remaining address becomes the default.
      security:
        - bearerAuth: []
      responses:
        "204":
          description: The address is deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"


  /v1/auth/verify-email:
    post:
      tags: [Auth]
      operationId: verifyEmail
      summary: Confirm the email address
      description: |
        Rate limited: 30 per 15 minutes per client IP (429 `RATE_LIMITED`).

        Uses the token from the verification email: the account's
        `email_verified` becomes true and the token stops working.
        Registration sends the first email; a token works for 24 hours, and
        only the newest one sent works.

        Until a mail provider arrives (Bab 6) the API does not send email:
        in development it writes the message, token included, to its log;
        elsewhere it logs only the subject.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenRequest"
      responses:
        "204":
          description: The email is verified.
        "400":
          $ref: "#/components/responses/BadEmailToken"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/auth/verify-email/resend:
    post:
      tags: [Auth]
      operationId: resendVerification
      summary: Send a new verification email
      description: Sends a new verification token to the caller's email; older tokens stop working. Does nothing when the email is verified already. Answers 202 either way, and 429 `RATE_LIMITED` after 3 requests per hour per account.
      security:
        - bearerAuth: []
      responses:
        "202":
          description: A new email is on its way, or none was needed.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/auth/forgot-password:
    post:
      tags: [Auth]
      operationId: forgotPassword
      summary: Ask for a password-reset email
      description: |
        Rate limited: 5 per hour per client IP and 3 per hour per email (429 `RATE_LIMITED`).

        Emails a reset token (valid for 30 minutes; only the newest works)
        when the email has an account. Always answers 202, whether or not
        it does, so the endpoint does not reveal which emails are
        registered. An account that signs in with Google only can set a
        password this way.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordRequest"
      responses:
        "202":
          description: If the email has an account, a reset email is on its way.
        "400":
          $ref: "#/components/responses/BadAuthRequest"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/auth/reset-password:
    post:
      tags: [Auth]
      operationId: resetPassword
      summary: Set a new password with a reset token
      description: |
        Rate limited: 10 per hour per client IP (429 `RATE_LIMITED`).

        Uses the token from the reset email to set a new password (same
        policy as registration). In the same transaction the email becomes
        verified, and **every session of the account is revoked**: its
        refresh tokens and access tokens stop working at once. The user
        logs in again with the new password.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "204":
          description: The password is changed and every session is over.
        "400":
          $ref: "#/components/responses/BadEmailToken"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/auth/google:
    post:
      tags: [Auth]
      operationId: googleLogin
      summary: Sign in with Google
      description: |
        Rate limited: 20 per 15 minutes per client IP (429 `RATE_LIMITED`).

        Takes a Google **ID token** that the web or mobile app got from
        Google Sign-In, and returns the tokens of a new session.

        The API verifies the token with Google's published keys (RS256),
        the issuer (`https://accounts.google.com`), the audience (our
        `GOOGLE_CLIENT_ID`; a token issued to another app is refused) and
        the expiry. The account is found by Google's stable subject id,
        never by email. The first sign-in of a Google account creates a
        `buyer` account without a password and with its email verified,
        provided Google has verified that email (`EMAIL_UNVERIFIED`
        otherwise). When a GoShop account already has that email, nothing
        is linked: 409 `EMAIL_TAKEN`, and the user logs in with their
        password, because linking on the email alone would hand the account
        to whoever controls a Google account with that address.

        In development without `GOOGLE_CLIENT_ID`, Google sign-in is off
        and this endpoint answers 404 `NOT_FOUND`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoogleLoginRequest"
      responses:
        "200":
          description: Signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPairDetail"
        "400":
          $ref: "#/components/responses/BadGoogleLogin"
        "401":
          $ref: "#/components/responses/InvalidGoogleToken"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/EmailTaken"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/cart:
    get:
      tags: [Cart]
      operationId: getCart
      summary: Get the cart
      description: The cart, oldest line first. A user who never added anything, and a guest without `X-Cart-Token`, get an empty cart.
      parameters:
        - $ref: "#/components/parameters/CartToken"
      security:
        - {}
        - bearerAuth: []
      responses:
        "200":
          description: The cart.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CartDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/CartNotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/cart/items:
    post:
      tags: [Cart]
      operationId: addCartItem
      summary: Add a variant to the cart
      parameters:
        - $ref: "#/components/parameters/CartToken"
      description: |
        A guest without `X-Cart-Token` gets a new guest cart: the answer
        carries its token in `cart_token` and in the `X-Cart-Token` header,
        the only time it is sent. New guest carts are rate limited per
        client IP (30 per hour).

        Adds `quantity` units of the variant. A variant already in the cart
        gets the sum. The line's quantity must stay within 99 and within the
        stock on hand, and a cart holds at most 50 lines. The line keeps the
        current price as the price the buyer has seen (`price_when_added`).
      security:
        - {}
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CartItemAdd"
      responses:
        "200":
          description: The cart after the change.
          headers:
            X-Cart-Token:
              description: Only when this request created a guest cart, its token.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CartAddResult"
        "400":
          $ref: "#/components/responses/BadCartRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/CartNotFound"
        "409":
          $ref: "#/components/responses/CartConflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/cart/items/{variant_id}:
    parameters:
      - name: variant_id
        in: path
        required: true
        description: The variant of the line. One that is not in the cart, or not a UUID, answers 404 `NOT_FOUND`.
        schema:
          type: string
          format: uuid
      - $ref: "#/components/parameters/CartToken"
    patch:
      tags: [Cart]
      operationId: updateCartItem
      summary: Change a line's quantity
      description: |
        Replaces the line's quantity (1–99, at most the stock on hand) and
        takes the current price as the one the buyer has seen. Saving the
        same quantity again is how a buyer accepts a changed price
        (`problem: price_changed`).
      security:
        - {}
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CartItemPatch"
      responses:
        "200":
          description: The cart after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CartDetail"
        "400":
          $ref: "#/components/responses/BadCartRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/CartLineNotFound"
        "409":
          $ref: "#/components/responses/CartConflict"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags: [Cart]
      operationId: removeCartItem
      summary: Remove a line
      security:
        - {}
        - bearerAuth: []
      responses:
        "200":
          description: The cart that is left.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CartDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/CartLineNotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/cart/merge:
    post:
      tags: [Cart]
      operationId: mergeCart
      summary: Move a guest cart into my cart
      description: |
        Called by the client right after any login (password, Google,
        registration) with the guest cart's token. For a variant in both
        carts the guest's quantity is added, up to 99 and the stock on hand,
        but the line never ends below what the user's cart already held. A
        guest line whose variant is sold out or no longer for sale is not
        carried over, nor are lines past the 50-line limit. The guest cart
        is deleted: forget its token after a 200, and after a 404 too.
      security:
        - bearerAuth: []
      parameters:
        - name: X-Cart-Token
          in: header
          required: true
          description: The guest cart to merge.
          schema:
            type: string
            maxLength: 100
      responses:
        "200":
          description: The user's cart after the merge.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CartDetail"
        "400":
          $ref: "#/components/responses/BadCartRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/CartNotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/checkout/preview:
    post:
      tags: [Checkout]
      operationId: previewCheckout
      summary: Check the cart before checkout
      description: |
        Validates the caller's cart exactly as checkout will and computes the
        totals, without writing anything. Limited per buyer
        (`APP_CHECKOUT_LIMIT_PER_MINUTE`, 30 per minute by default, as are
        shipping quotes and checkout): 429 `RATE_LIMITED`. With `address_id`, `courier` and
        `service` the shipping fee is priced now and added. Checkout validates again on locked rows, so a
        preview that passed is a hint, not a promise.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckoutPreviewRequest"
      responses:
        "200":
          description: Every line can be bought as it is.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutPreviewDetail"
        "400":
          $ref: "#/components/responses/BadCheckoutRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/CheckoutConflict"
        "422":
          $ref: "#/components/responses/ShippingUnavailable"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/UpstreamUnavailable"

  /v1/checkout/shipping-quotes:
    get:
      tags: [Checkout]
      operationId: getShippingQuotes
      summary: Price shipping for my cart
      description: |
        Every service of JNE, J&T and SiCepat that can carry the caller's
        cart (its total weight) to one of the caller's addresses, cheapest
        first. Lines with problems still count; checkout asks again for the
        chosen service, so a quote is not a reservation. Without
        `BITESHIP_API_KEY` the API prices from a fixed table per started
        kilogram; with it, from Biteship.
      security:
        - bearerAuth: []
      parameters:
        - name: address_id
          in: query
          required: true
          description: One of the caller's addresses.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The quotes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShippingQuotesDetail"
        "400":
          $ref: "#/components/responses/BadCheckoutRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/CheckoutConflict"
        "422":
          $ref: "#/components/responses/ShippingUnavailable"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/UpstreamUnavailable"

  /v1/checkout:
    post:
      tags: [Checkout]
      operationId: checkout
      summary: Place an order from my cart
      description: |
        Creates an order waiting for payment from every line of the
        caller's cart, in one transaction: the buyer's row is locked first,
        then the variants in id order; every line is validated again on the
        locked rows (409 `CHECKOUT_PROBLEMS`); the voucher's use is counted
        with a guarded update; the order and its line snapshots are stored;
        the stock is decremented with a guarded update; and the ordered
        lines leave the cart. The shipping fee is asked for again before
        the transaction and is never taken from the client. The order must
        be paid before `payment_expires_at` (`APP_PAYMENT_TTL`, 24 hours by
        default), or it is cancelled and its stock returned.

        Needs a verified email (403 `EMAIL_UNVERIFIED`). A buyer may have
        at most 5 unpaid orders (409 `TOO_MANY_PENDING_ORDERS`).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckoutRequest"
            example:
              address_id: 01a16827-5e2f-7c3e-9f3a-2b6d8e4c1a90
              courier: jne
              service: REG
              voucher_code: HEMAT10
      responses:
        "201":
          description: The order, waiting for payment.
          headers:
            Location:
              description: URL of the new order, `/v1/orders/{id}`.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderDetail"
        "400":
          $ref: "#/components/responses/BadCheckoutRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/EmailUnverified"
        "409":
          $ref: "#/components/responses/CheckoutConflict"
        "422":
          $ref: "#/components/responses/ShippingUnavailable"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/UpstreamUnavailable"

