  /v1/admin/orders/{id}/cancel:
    parameters:
      - $ref: "#/components/parameters/OrderID"
    post:
      tags: [Admin]
      operationId: cancelOrder
      summary: Cancel an order before it ships
      description: |
        pending_payment, paid or processing → cancelled (`seller_cancelled`).
        The stock (its variants locked in id order) and the voucher use go
        back in the same transaction. Refunding a paid order is Bab 6's.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The order after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/OrderNotFound"
        "409":
          $ref: "#/components/responses/InvalidTransition"
        "500":
          $ref: "#/components/responses/InternalError"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        The `access_token` from `/v1/auth/login`, `/v1/auth/google` or
        `/v1/auth/refresh`, as `Authorization: Bearer <token>`. It lives 15
        minutes by default (ADR 0005); refresh it before or after it
        expires.

  parameters:
    CartToken:
      name: X-Cart-Token
      in: header
      required: false
      description: |
        A guest cart's token, as returned when the guest cart was created.
        Ignored when the request carries an access token (the user's own
        cart is used). One that is malformed, unknown or already merged
        answers 404 `CART_NOT_FOUND`.
      schema:
        type: string
        maxLength: 100
    OrderID:
      name: id
      in: path
      required: true
      description: Order ID. One that is not a UUID answers 404 `NOT_FOUND`.
      schema:
        type: string
        format: uuid

  schemas:
    Money:
      type: object
      description: An amount of money. Rupiah has no minor unit in practice, so `amount` is whole rupiah.
      required: [amount, currency]
      additionalProperties: false
      properties:
        amount:
          type: integer
          format: int64
          minimum: 0
          description: Whole rupiah. 89000 means Rp89.000.
          example: 89000
        currency:
          type: string
          const: IDR
          description: ISO 4217 currency code. Always IDR.

    Category:
      type: object
      required: [id, slug, name, parent_id]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
          pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
          maxLength: 100
          example: kaos
        name:
          type: string
          example: Kaos
        parent_id:
          type: [string, "null"]
          format: uuid
          description: Parent category, or `null` for a top-level category.

    ProductVariant:
      type: object
      description: One sellable item of a product (for example one size). Price and stock live here, not on the product.
      required: [id, sku, name, price, stock]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        sku:
          type: string
          description: Unique across the store, upper-case.
          example: KPH-M
        name:
          type: string
          example: M
        price:
          $ref: "#/components/schemas/Money"
        stock:
          type: integer
          minimum: 0
          description: Units available right now.

    Product:
      type: object
      required: [id, slug, name, description, category, price_from, in_stock, variants, created_at]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
          pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
          maxLength: 200
          example: kaos-polos-hitam
        name:
          type: string
          example: Kaos Polos Hitam
        description:
          type: string
        category:
          $ref: "#/components/schemas/Category"
        price_from:
          $ref: "#/components/schemas/Money"
          description: Price of the cheapest sellable (non-archived) variant.
        in_stock:
          type: boolean
          description: True when at least one sellable variant has stock. Computed per request, never stored.
        variants:
          type: array
          description: The sellable variants. Archived variants are never returned.
          minItems: 1
          items:
            $ref: "#/components/schemas/ProductVariant"
        created_at:
          type: string
          format: date-time

    ProductWrite:
      type: object
      description: A product as the admin writes it.
      required: [category_id, slug, name, status, variants]
      additionalProperties: false
      properties:
        category_id:
          type: string
          format: uuid
        slug:
          type: string
          pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
          maxLength: 200
          example: kaos-polos-hitam
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 5000
          default: ""
        status:
          type: string
          enum: [draft, active, archived]
          description: Only `active` products appear in the storefront.
        variants:
          type: array
          description: Every sellable variant of the product. SKUs must be unique within the list.
          minItems: 1
          maxItems: 50
          items:
            $ref: "#/components/schemas/VariantWrite"

    VariantWrite:
      type: object
      required: [sku, name, price, stock, weight_grams]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          description: An existing sellable variant of this product, to update it. Leave it out for a new variant, and always on create.
        version:
          type: integer
          minimum: 0
          description: Required with `id`; ignored without it. The variant's `version` as the form loaded it; a stale one answers 409 `VERSION_CONFLICT`.
        sku:
          type: string
          minLength: 1
          maxLength: 64
          description: Trimmed and upper-cased by the API. Unique across the store, archived variants included.
          example: KPH-M
        name:
          type: string
          minLength: 1
          maxLength: 100
          example: M
        price:
          type: integer
          format: int64
          minimum: 1
          maximum: 1000000000
          description: Whole rupiah.
          example: 89000
        stock:
          type: integer
          minimum: 0
          maximum: 1000000
        weight_grams:
          type: integer
          minimum: 1
          maximum: 100000

    AdminVariant:
      type: object
      required: [id, sku, name, price, stock, weight_grams, version]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        sku:
          type: string
        name:
          type: string
        price:
          $ref: "#/components/schemas/Money"
        stock:
          type: integer
          minimum: 0
        weight_grams:
          type: integer
          minimum: 1
        version:
          type: integer
          minimum: 0
          description: Changes with every write to the variant, a checkout's stock decrement included. Send it back with `PUT`.

    AdminProduct:
      type: object
      description: A product as the admin sees it, in any status.
      required: [id, category_id, slug, name, description, status, price_from, variants, created_at, updated_at]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        category_id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [draft, active, archived]
        price_from:
          description: Price of the cheapest sellable variant, or `null` when the product has none.
          oneOf:
            - $ref: "#/components/schemas/Money"
            - type: "null"
        variants:
          type: array
          description: The sellable (non-archived) variants, cheapest first.
          items:
            $ref: "#/components/schemas/AdminVariant"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    AdminProductDetail:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          $ref: "#/components/schemas/AdminProduct"

    PageInfo:
      type: object
      required: [next_cursor]
      additionalProperties: false
      properties:
        next_cursor:
          type: [string, "null"]
          description: Cursor for the next page, or `null` on the last page. A page may hold fewer than `limit` products, even none, while `next_cursor` is not null; stop only when it is null.

    CategoryList:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Category"

    ProductList:
      type: object
      required: [data, page]
      additionalProperties: false
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Product"
        page:
          $ref: "#/components/schemas/PageInfo"

    ProductDetail:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          $ref: "#/components/schemas/Product"

    RegisterRequest:
      type: object
      required: [email, password, name]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          description: Trimmed and lower-cased by the API. ASCII only.
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 128
          description: Counted in characters. Never logged, never returned.
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Trimmed by the API.

    User:
      type: object
      description: An account as its owner and the auth endpoints see it.
      required: [id, email, name, phone, role, email_verified, created_at]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        phone:
          type: [string, "null"]
          description: An Indonesian phone number, or `null` when none is set.
        role:
          type: string
          enum: [buyer, seller, admin]
          description: What the user may do. New accounts are always `buyer`.
        email_verified:
          type: boolean
        created_at:
          type: string
          format: date-time

    UserDetail:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          $ref: "#/components/schemas/User"

    LoginRequest:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email:
          type: string
          maxLength: 254
          description: Trimmed and lower-cased before the lookup.
        password:
          type: string
          format: password
          maxLength: 1024

    TokenPair:
      type: object
      description: The tokens of a session (ADR 0005) and the account they belong to.
      required: [access_token, token_type, expires_in, refresh_token, refresh_expires_in, user]
      additionalProperties: false
      properties:
        access_token:
          type: string
          description: "A JWT. Send it as `Authorization: Bearer <access_token>`. Clients must not rely on its claims; they may change."
        token_type:
          type: string
          const: Bearer
        expires_in:
          type: integer
          minimum: 0
          description: Seconds until the access token expires.
        refresh_token:
          type: string
          description: Opaque; send it to `/v1/auth/refresh` and `/v1/auth/logout`. Keep it in the platform's secure store (mobile); never in `localStorage`. Shown once, stored by the API only as a hash.
        refresh_expires_in:
          type: integer
          minimum: 0
          description: Seconds until the refresh token expires (`APP_REFRESH_TOKEN_TTL`, 30 days by default). Every refresh starts a new period.
        user:
          $ref: "#/components/schemas/User"


    TokenPairDetail:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          $ref: "#/components/schemas/TokenPair"

    RefreshRequest:
      type: object
      required: [refresh_token]
      additionalProperties: false
      properties:
        refresh_token:
          type: string
          maxLength: 200
          description: The `refresh_token` of the last login or refresh.

    TokenRequest:
      type: object
      required: [token]
      additionalProperties: false
      properties:
        token:
          type: string
          maxLength: 200
          description: The token from the email, exactly as sent.

    ForgotPasswordRequest:
      type: object
      required: [email]
      additionalProperties: false
      properties:
        email:
          type: string
          maxLength: 254

    ResetPasswordRequest:
      type: object
      required: [token, password]
      additionalProperties: false
      properties:
        token:
          type: string
          maxLength: 200
          description: The token from the reset email.
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 128
          description: The new password; the same policy as registration.

    GoogleLoginRequest:
      type: object
      required: [id_token]
      additionalProperties: false
      properties:
        id_token:
          type: string
          maxLength: 8192
          description: The ID token (a JWT) from Google Sign-In, issued to `GOOGLE_CLIENT_ID`.

    ProfilePatch:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Trimmed by the API.
        phone:
          type: [string, "null"]
          description: An Indonesian phone number such as `081234567890` or `+6281234567890`; `null` removes it.

    Address:
      type: object
      required: [id, label, recipient_name, phone, street, city, province, postal_code, is_default, created_at, updated_at]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        label:
          type: string
          example: Rumah
        recipient_name:
          type: string
        phone:
          type: string
        street:
          type: string
        city:
          type: string
        province:
          type: string
        postal_code:
          type: string
          pattern: "^[1-9][0-9]{4}$"
        is_default:
          type: boolean
          description: Exactly one of a user's addresses is the default.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    AddressCreate:
      type: object
      required: [label, recipient_name, phone, street, city, province, postal_code]
      additionalProperties: false
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 50
        recipient_name:
          type: string
          minLength: 1
          maxLength: 100
        phone:
          type: string
          description: An Indonesian phone number, `08…`, `628…` or `+628…`.
        street:
          type: string
          minLength: 1
          maxLength: 500
        city:
          type: string
          minLength: 1
          maxLength: 100
        province:
          type: string
          minLength: 1
          maxLength: 100
        postal_code:
          type: string
          pattern: "^[1-9][0-9]{4}$"
        is_default:
          type: boolean
          default: false

    AddressPatch:
      type: object
      description: Every field is optional; a field that is left out or `null` keeps its value. Text is trimmed by the API.
      additionalProperties: false
      properties:
        label:
          type: [string, "null"]
          minLength: 1
          maxLength: 50
        recipient_name:
          type: [string, "null"]
          minLength: 1
          maxLength: 100
        phone:
          type: [string, "null"]
        street:
          type: [string, "null"]
          minLength: 1
          maxLength: 500
        city:
          type: [string, "null"]
          minLength: 1
          maxLength: 100
        province:
          type: [string, "null"]
          minLength: 1
          maxLength: 100
        postal_code:
          type: [string, "null"]
          pattern: "^[1-9][0-9]{4}$"
        is_default:
          type: [boolean, "null"]

    AddressDetail:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          $ref: "#/components/schemas/Address"

    AddressList:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/Address"

    HealthCheck:
      type: object
      required: [status, duration_ms]
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [ok, unavailable]
        error:
          type: string
          description: Why the check failed. Present only when `status` is `unavailable` and the server runs in development; elsewhere the API sets `healthx.Handler.HideErrors`, which drops the text (it can contain internal addresses) from the response. `healthx` itself does not log it; GoShop's own check wrappers log the error before returning it (Bab 2).
        duration_ms:
          type: integer
          minimum: 0

    HealthStatus:
      type: object
      description: Health probe body, as written by santekno/sdk `healthx` (v0.2.0 sends it as `application/json`). Probes use this body for 503 too, not the `Error` body.
      required: [status]
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [ok, unavailable]
        checks:
          type: object
          description: One entry per dependency check, keyed by its name. Omitted when there are no checks.
          additionalProperties:
            $ref: "#/components/schemas/HealthCheck"

    Error:
      type: object
      description: The only error body the API returns (except health probes). It is what `DefaultErrorWriter` in santekno/sdk `middleware/chi` (v0.2.0) writes from an `errx.AppError`; `details` is omitted when the error has none.
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: object
          required: [code, message]
          additionalProperties: false
          properties:
            code:
              type: string
              pattern: "^[A-Z][A-Z0-9_]*$"
              description: Machine-readable, SCREAMING_SNAKE_CASE. Clients branch on this, never on `message`.
              example: NOT_FOUND
            message:
              type: string
              description: Human-readable and safe to show; never contains internals.
              example: product not found
            details:
              type: object
              description: Optional structured context, for example which fields failed validation.
              additionalProperties: true

    CartLine:
      type: object
      required: [variant_id, product_id, product_slug, product_name, variant_name, sku, quantity, unit_price, price_when_added, line_total, stock, weight_grams, problem]
      additionalProperties: false
      properties:
        variant_id:
          type: string
          format: uuid
        product_id:
          type: string
          format: uuid
        product_slug:
          type: string
        product_name:
          type: string
        variant_name:
          type: string
        sku:
          type: string
        quantity:
          type: integer
          minimum: 1
          maximum: 99
        unit_price:
          description: The price now.
          $ref: "#/components/schemas/Money"
        price_when_added:
          description: The price when the buyer last added or changed the line. Checkout refuses the line while it differs from `unit_price`.
          $ref: "#/components/schemas/Money"
        line_total:
          description: "`unit_price` × `quantity`."
          $ref: "#/components/schemas/Money"
        stock:
          type: integer
          minimum: 0
          description: Units available right now.
        weight_grams:
          type: integer
          minimum: 1
        problem:
          type: [string, "null"]
          enum: [unavailable, insufficient_stock, price_changed, null]
          description: Why checkout would refuse this line now, or `null`. `unavailable` means the variant was archived or its product is no longer active; remove the line. `price_changed`; save the line again to accept the new price.

    Cart:
      type: object
      required: [lines, item_count, subtotal]
      additionalProperties: false
      properties:
        lines:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/CartLine"
        item_count:
          type: integer
          minimum: 0
          description: Units in the cart, for a badge.
        subtotal:
          description: Every line at today's price. A hint for the cart page; checkout computes what is charged.
          $ref: "#/components/schemas/Money"

    CartDetail:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          $ref: "#/components/schemas/Cart"

    CartAddResult:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          $ref: "#/components/schemas/Cart"
        cart_token:
          type: string
          description: Only when this request created a guest cart. Keep it and send it as `X-Cart-Token`.

    CartItemAdd:
      type: object
      required: [variant_id, quantity]
      additionalProperties: false
      properties:
        variant_id:
          type: string
          format: uuid
        quantity:
          type: integer
          minimum: 1
          maximum: 99
          description: Units to add to what the line already holds.

    CartItemPatch:
      type: object
      required: [quantity]
      additionalProperties: false
      properties:
        quantity:
          type: integer
          minimum: 1
          maximum: 99

    CheckoutPreviewRequest:
      type: object
      description: What the buyer has chosen so far; every field is optional. `courier` and `service` go together and need `address_id`.
      additionalProperties: false
      properties:
        address_id:
          type: string
          format: uuid
          description: One of the caller's addresses.
        courier:
          type: string
          enum: [jne, jnt, sicepat]
        service:
          type: string
          maxLength: 20
          description: A `service` from `GET /v1/checkout/shipping-quotes`.
        voucher_code:
          type: string
          minLength: 3
          maxLength: 32
          pattern: "^[A-Za-z0-9]+$"
          description: A voucher code, matched case-insensitively.

    CheckoutPreview:
      type: object
      required: [lines, totals]
      additionalProperties: false
      properties:
        lines:
          type: array
          items:
            $ref: "#/components/schemas/CartLine"
        totals:
          $ref: "#/components/schemas/OrderTotals"
        shipping:
          description: The chosen courier service, priced now; `null` until `courier` and `service` are sent.
          oneOf:
            - $ref: "#/components/schemas/ShippingQuote"
            - type: "null"
        voucher:
          description: The applied voucher; `null` without `voucher_code`. Its discount is `totals.discount`.
          oneOf:
            - $ref: "#/components/schemas/AppliedVoucher"
            - type: "null"

    AppliedVoucher:
      type: object
      required: [code, kind, value, max_discount]
      additionalProperties: false
      properties:
        code:
          type: string
          example: HEMAT10
        kind:
          type: string
          enum: [percent, fixed]
        value:
          type: integer
          minimum: 1
          description: The percent (1–100) for `percent`, whole rupiah for `fixed`.
        max_discount:
          description: The most the voucher takes off, or `null` for no cap.
          oneOf:
            - $ref: "#/components/schemas/Money"
            - type: "null"

    OrderTotals:
      type: object
      description: |
        What an order charges, in whole rupiah (ADR 0006). `total` =
        `subtotal` - `discount` + `shipping_fee`. A percent discount is
        computed exactly and rounded once to the nearest rupiah (halves
        away from zero), then capped at the voucher's maximum and at the
        subtotal; the shipping fee is never discounted.
      required: [subtotal, discount, shipping_fee, total, weight_grams]
      additionalProperties: false
      properties:
        subtotal:
          description: Every line at its unit price × quantity.
          $ref: "#/components/schemas/Money"
        discount:
          $ref: "#/components/schemas/Money"
        shipping_fee:
          $ref: "#/components/schemas/Money"
        total:
          $ref: "#/components/schemas/Money"
        weight_grams:
          type: integer
          minimum: 0
          description: The weight of every unit, which the shipping fee is quoted for.

    CheckoutPreviewDetail:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          $ref: "#/components/schemas/CheckoutPreview"

    CheckoutProblemsError:
      type: object
      description: The `Error` body of a checkout 409, with `details.lines` typed for `CHECKOUT_PROBLEMS`.
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: object
          required: [code, message]
          additionalProperties: false
          properties:
            code:
              type: string
              pattern: "^[A-Z][A-Z0-9_]*$"
            message:
              type: string
            details:
              type: object
              additionalProperties: true
              properties:
                lines:
                  type: array
                  description: Every line checkout refuses, in cart order (`CHECKOUT_PROBLEMS` only).
                  items:
                    $ref: "#/components/schemas/CheckoutProblem"

    CheckoutProblem:
      type: object
      description: One cart line checkout refuses.
      required: [variant_id, sku, problem, quantity, available, unit_price, price_when_added]
      additionalProperties: false
      properties:
        variant_id:
          type: string
          format: uuid
        sku:
          type: string
        problem:
          type: string
          enum: [unavailable, insufficient_stock, price_changed]
          description: "`unavailable`: archived, or its product is no longer active; remove the line. `insufficient_stock`: lower the quantity to `available` or remove the line. `price_changed`: save the line again (PATCH with the same quantity) to accept `unit_price`."
        quantity:
          type: integer
          description: What the line asks for.
        available:
          type: integer
          minimum: 0
          description: Stock on hand; 0 for an unavailable variant.
        unit_price:
          description: The price now.
          $ref: "#/components/schemas/Money"
        price_when_added:
          description: The price the buyer saw.
          $ref: "#/components/schemas/Money"

    ShippingQuote:
      type: object
      required: [courier, courier_name, service, service_name, price, etd]
      additionalProperties: false
      properties:
        courier:
          type: string
          enum: [jne, jnt, sicepat]
        courier_name:
          type: string
          example: JNE
        service:
          type: string
          description: The courier's service code, upper-case. Send it back as `service`.
          example: REG
        service_name:
          type: string
          example: Reguler
        price:
          $ref: "#/components/schemas/Money"
        etd:
          type: string
          description: Estimated delivery time as the courier says it.
          example: 2-3 days

    ShippingQuotes:
      type: object
      required: [weight_grams, quotes]
      additionalProperties: false
      properties:
        weight_grams:
          type: integer
          minimum: 0
        quotes:
          type: array
          description: Cheapest first.
          items:
            $ref: "#/components/schemas/ShippingQuote"

    ShippingQuotesDetail:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          $ref: "#/components/schemas/ShippingQuotes"

    CheckoutRequest:
      type: object
      required: [address_id, courier, service]
      additionalProperties: false
      properties:
        address_id:
          type: string
          format: uuid
          description: One of the caller's addresses; the order keeps a copy.
        courier:
          type: string
          enum: [jne, jnt, sicepat]
        service:
          type: string
          maxLength: 20
          description: A `service` from `GET /v1/checkout/shipping-quotes`.
        voucher_code:
          type: string
          minLength: 3
          maxLength: 32
          pattern: "^[A-Za-z0-9]+$"
          description: A voucher code, matched case-insensitively.

    OrderItem:
      type: object
      description: One order line, copied at checkout.
      required: [id, variant_id, product_name, variant_name, sku, unit_price, quantity, line_total]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        variant_id:
          type: string
          format: uuid
        product_name:
          type: string
        variant_name:
          type: string
        sku:
          type: string
        unit_price:
          $ref: "#/components/schemas/Money"
        quantity:
          type: integer
          minimum: 1
        line_total:
          $ref: "#/components/schemas/Money"

    ShippingAddressSnapshot:
      type: object
      required: [recipient_name, phone, street, city, province, postal_code]
      additionalProperties: false
      properties:
        recipient_name:
          type: string
        phone:
          type: string
        street:
          type: string
        city:
          type: string
        province:
          type: string
        postal_code:
          type: string

    OrderShipping:
      type: object
      required: [courier, service, tracking_number, address]
      additionalProperties: false
      properties:
        courier:
          type: string
          enum: [jne, jnt, sicepat]
        service:
          type: string
        tracking_number:
          type: [string, "null"]
          description: The airway bill, set when the order ships.
        address:
          $ref: "#/components/schemas/ShippingAddressSnapshot"

    Order:
      type: object
      required: [id, code, status, cancel_reason, items, totals, voucher_code, shipping, payment_expires_at, paid_at, shipped_at, completed_at, cancelled_at, created_at, updated_at]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          pattern: "^GS-[0-9]{8}-[0-9A-Z]{6}$"
          description: The order number buyers see; the date is in WIB.
          example: GS-20261101-7KQ2M9
        status:
          type: string
          enum: [pending_payment, paid, processing, shipped, completed, cancelled]
        cancel_reason:
          type: [string, "null"]
          enum: [payment_expired, buyer_cancelled, seller_cancelled, null]
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"
        totals:
          $ref: "#/components/schemas/OrderTotals"
        voucher_code:
          type: [string, "null"]
        shipping:
          $ref: "#/components/schemas/OrderShipping"
        payment_expires_at:
          type: string
          format: date-time
          description: An unpaid order is cancelled (`payment_expired`) after this.
        paid_at:
          type: [string, "null"]
          format: date-time
        shipped_at:
          type: [string, "null"]
          format: date-time
        completed_at:
          type: [string, "null"]
          format: date-time
        cancelled_at:
          type: [string, "null"]
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    OrderDetail:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          $ref: "#/components/schemas/Order"

    OrderSummary:
      type: object
      description: An order as a list shows it, without items.
      required: [id, code, status, total, payment_expires_at, created_at, updated_at]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        status:
          type: string
          enum: [pending_payment, paid, processing, shipped, completed, cancelled]
        total:
          $ref: "#/components/schemas/Money"
        payment_expires_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    OrderList:
      type: object
      required: [data, page]
      additionalProperties: false
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/OrderSummary"
        page:
          $ref: "#/components/schemas/PageInfo"

    ShipRequest:
      type: object
      required: [tracking_number]
      additionalProperties: false
      properties:
        tracking_number:
          type: string
          pattern: "^[A-Za-z0-9-]{6,40}$"
          description: The courier's airway bill; stored upper-case.
          example: JNE0123456789

  responses:
    BadRequest:
      description: A query parameter is invalid (including a `cursor` the API did not make for the same `category`, `q` and `sort`), or `category` names no category.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            validationFailed:
              summary: A parameter is out of range
              value:
                error:
                  code: VALIDATION_FAILED
                  message: invalid query parameters
                  details:
                    limit: must be between 1 and 100
            unknownCategory:
              summary: The category slug does not exist
              value:
                error:
                  code: UNKNOWN_CATEGORY
                  message: category not found
                  details:
                    category: sepatu
            invalidCursor:
              summary: The cursor is not from page.next_cursor for these filters
              value:
                error:
                  code: VALIDATION_FAILED
                  message: invalid query parameters
                  details:
                    cursor: is not a cursor from page.next_cursor for these filters; start again without it
    BadWrite:
      description: The body is not valid JSON or breaks the schema (`VALIDATION_FAILED`, with one entry per field such as `variants[0].price`), or `category_id` names no category (`UNKNOWN_CATEGORY`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            validationFailed:
              summary: Fields break the schema
              value:
                error:
                  code: VALIDATION_FAILED
                  message: invalid request
                  details:
                    slug: must be lower-case letters and digits in words joined by single hyphens
                    variants[0].price: must be between 1 and 1000000000
            unknownCategory:
              summary: The category does not exist
              value:
                error:
                  code: UNKNOWN_CATEGORY
                  message: category not found
                  details:
                    category_id: names no category
    Conflict:
      description: |
        Another product already has the slug (`SLUG_TAKEN`), a variant anywhere in the store, archived ones included, already has one of the SKUs (`SKU_TAKEN`), or (on `PUT`) a variant changed since its `version` was read (`VERSION_CONFLICT`, `details.variant_id`; reload and save again).

        Known Bab 3 limitation: within one save, each variant's SKU is checked when that variant is written, so swapping the SKUs of two variants, or giving one variant the SKU another variant of the same product has right now, answers 409 `SKU_TAKEN`. Save twice instead, through a temporary SKU.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            slugTaken:
              summary: The slug is in use
              value:
                error:
                  code: SLUG_TAKEN
                  message: another product already uses this slug
                  details:
                    slug: another product already uses this slug
            skuTaken:
              summary: A SKU is in use
              value:
                error:
                  code: SKU_TAKEN
                  message: a variant with one of these SKUs already exists
                  details:
                    variants: a variant with one of these SKUs already exists
            versionConflict:
              summary: A variant changed since it was loaded
              value:
                error:
                  code: VERSION_CONFLICT
                  message: a variant changed since you loaded it (a sale or another save); reload the product and save again
                  details:
                    variant_id: 01a16823-6427-7fa0-adf7-c05af7159479
    NotFound:
      description: The resource does not exist, is not active, or its slug is malformed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: NOT_FOUND
              message: product not found
    BadAuthRequest:
      description: The body is not valid JSON or breaks the schema (`VALIDATION_FAILED`, one entry per field). A password that breaks the policy is reported under `password`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: VALIDATION_FAILED
              message: invalid request
              details:
                email: must be an email address such as budi@example.com
                password: must be between 8 and 128 characters
    EmailTaken:
      description: Another account already uses this email.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: EMAIL_TAKEN
              message: an account with this email already exists
              details:
                email: is already registered; log in or reset the password

    InvalidCredentials:
      description: The email and password do not match an account. The same answer for every reason, so it does not reveal whether the email is registered.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: INVALID_CREDENTIALS
              message: email or password is incorrect

    InvalidRefreshToken:
      description: The refresh token is malformed, unknown, revoked, already used (`TOKEN_INVALID`; a reused token also revokes its session), or expired (`TOKEN_EXPIRED`). Either way the user logs in again.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            invalid:
              summary: Unknown, revoked or reused
              value:
                error:
                  code: TOKEN_INVALID
                  message: the token is invalid or has been revoked; log in again
            expired:
              summary: Expired
              value:
                error:
                  code: TOKEN_EXPIRED
                  message: the token has expired; log in again

    Unauthorized:
      description: |
        No valid access token: the `Authorization` header is missing or not
        `Bearer <token>`, or the token is malformed, expired, signed with
        another key, revoked (its session was logged out or ended), or its
        account was deleted. The response carries
        `WWW-Authenticate: Bearer realm="goshop"`. The code is always
        `UNAUTHORIZED` (sdk `JWTAuth` does not tell an expired token from a
        bad one), so a client refreshes once and retries; if the refresh
        fails, the user logs in again.
      headers:
        WWW-Authenticate:
          description: Always `Bearer realm="goshop"`.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: UNAUTHORIZED
              message: invalid or expired token

    Forbidden:
      description: The caller is logged in, but their role may not do this. Admin endpoints need `seller` or `admin`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: FORBIDDEN
              message: your role is not allowed to do this

    BadEmailToken:
      description: The body is invalid (`VALIDATION_FAILED`; a new password that breaks the policy is reported under `password`), or the token from the email cannot be used. `TOKEN_INVALID` means it is malformed, unknown, already used, replaced by a newer email, or its account was deleted; `TOKEN_EXPIRED` means it is too old. Ask for a new email either way.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            invalid:
              summary: Unknown or used
              value:
                error:
                  code: TOKEN_INVALID
                  message: the token is invalid or has already been used
            expired:
              summary: Too old
              value:
                error:
                  code: TOKEN_EXPIRED
                  message: the token has expired; ask for a new email

    BadGoogleLogin:
      description: The body is invalid (`VALIDATION_FAILED`), or Google has not verified the account's email (`EMAIL_UNVERIFIED`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: EMAIL_UNVERIFIED
              message: verify the email of your Google account first
    InvalidGoogleToken:
      description: The ID token failed verification (signature, issuer, audience or expiry), or its email cannot be stored (not ASCII).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: TOKEN_INVALID
              message: the Google sign-in could not be verified; try again

    RateLimited:
      description: |
        Too many attempts. Wait `Retry-After` seconds (also in
        `details.retry_after_seconds`) and try again. Limits are fixed
        windows counted in Redis per client IP, per email or per account,
        shared by every API instance; every attempt counts, successful or
        not.
      headers:
        Retry-After:
          description: Seconds until the window resets.
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: RATE_LIMITED
              message: too many attempts; try again later
              details:
                retry_after_seconds: 540

    BadMeRequest:
      description: The body is not valid JSON or breaks the schema (`VALIDATION_FAILED`, one entry per field).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: VALIDATION_FAILED
              message: invalid request
              details:
                phone: must be an Indonesian phone number such as 081234567890 or +6281234567890
                postal_code: must be a 5-digit Indonesian postal code
    AddressConflict:
      description: The caller already has 20 addresses (`ADDRESS_LIMIT_REACHED`), or the change would leave them without a default address (`DEFAULT_ADDRESS_REQUIRED`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            limit:
              summary: Too many addresses
              value:
                error:
                  code: ADDRESS_LIMIT_REACHED
                  message: you already have the maximum number of addresses; delete one first
                  details:
                    max: 20
            defaultRequired:
              summary: Unsetting the default
              value:
                error:
                  code: DEFAULT_ADDRESS_REQUIRED
                  message: make another address the default instead
                  details:
                    is_default: the default address cannot be unset; set is_default on another address

    InternalError:
      description: Unexpected server error. The code is always `INTERNAL_ERROR`, the code sdk `middleware/chi` `Recovery` writes after a panic, and handlers use the same code for every other 500. The details are in the server log, never in the response.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: INTERNAL_ERROR
              message: internal server error
    Unavailable:
      description: The process or one of its dependencies is not healthy.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/HealthStatus"
          example:
            status: unavailable
            checks:
              postgres: { status: unavailable, duration_ms: 3 }
              redis: { status: ok, duration_ms: 1 }
    BadCartRequest:
      description: The body is not valid JSON or breaks the schema (`VALIDATION_FAILED`, one entry per field).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: VALIDATION_FAILED
              message: invalid request
              details:
                quantity: must be between 1 and 99
    CartConflict:
      description: The variant is archived, unknown or its product is not active (`VARIANT_UNAVAILABLE`), the line would hold more than the stock (`INSUFFICIENT_STOCK`, with `details.available`) or more than 99 units (`QUANTITY_LIMIT`), or the cart already has 50 lines (`CART_FULL`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            unavailable:
              summary: Not for sale
              value:
                error:
                  code: VARIANT_UNAVAILABLE
                  message: this variant is not for sale
            insufficientStock:
              summary: Too few in stock
              value:
                error:
                  code: INSUFFICIENT_STOCK
                  message: not enough stock for this quantity
                  details:
                    available: 3
            quantityLimit:
              summary: More than 99 units
              value:
                error:
                  code: QUANTITY_LIMIT
                  message: a cart line holds at most 99 units
                  details:
                    max: 99
            cartFull:
              summary: Too many lines
              value:
                error:
                  code: CART_FULL
                  message: the cart already has the maximum number of lines; remove one first
                  details:
                    max: 50
    CartNotFound:
      description: The `X-Cart-Token` is malformed, unknown, or its cart was merged already. Forget the token; the next add starts a new guest cart.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: CART_NOT_FOUND
              message: this cart token is not valid any more; forget it and start a new cart
    CartLineNotFound:
      description: The cart has no line for this variant (`NOT_FOUND`), or the `X-Cart-Token` names no cart (`CART_NOT_FOUND`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            line:
              summary: Not in the cart
              value:
                error:
                  code: NOT_FOUND
                  message: this variant is not in the cart
            cart:
              summary: Unknown guest cart
              value:
                error:
                  code: CART_NOT_FOUND
                  message: this cart token is not valid any more; forget it and start a new cart
    CheckoutConflict:
      description: |
        The cart is empty (`CART_EMPTY`); some lines cannot be bought as they are (`CHECKOUT_PROBLEMS`, with every such line in `details.lines`, each a `CheckoutProblem`); or the voucher does not apply (`VOUCHER_NOT_APPLICABLE`, with `details.voucher_code` and `details.reason`: `not_found` (no such code, or a promo that has not started yet: the two answer alike, so upcoming codes cannot be guessed), `expired`, `exhausted` (no uses left), `per_user_limit` (this buyer has used it up), or `min_spend` with `details.min_spend`). At `POST /v1/checkout` also: the buyer already has 5 unpaid orders (`TOO_MANY_PENDING_ORDERS`, `details.max`), or the cart changed while the checkout ran (`CART_CHANGED`: another checkout of the same cart took its lines, it was edited on another device, or a variant's weight changed after the shipping quote; review the cart and try again).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CheckoutProblemsError"
          examples:
            empty:
              summary: Nothing to check out
              value:
                error:
                  code: CART_EMPTY
                  message: the cart is empty
            problems:
              summary: Lines to fix
              value:
                error:
                  code: CHECKOUT_PROBLEMS
                  message: some cart lines cannot be bought as they are; fix them and try again
                  details:
                    lines:
                      - variant_id: 01a16823-6427-7fa0-adf7-c05af7159479
                        sku: KPH-S
                        problem: insufficient_stock
                        quantity: 5
                        available: 2
                        unit_price: { amount: 89000, currency: IDR }
                        price_when_added: { amount: 89000, currency: IDR }
            voucher:
              summary: The voucher does not apply
              value:
                error:
                  code: VOUCHER_NOT_APPLICABLE
                  message: this voucher cannot be used on this order
                  details:
                    voucher_code: HEMAT10
                    reason: min_spend
                    min_spend: { amount: 100000, currency: IDR }
    BadCheckoutRequest:
      description: The body or query breaks the schema (`VALIDATION_FAILED`, one entry per field), including an `address_id` that names none of the caller's addresses, and a `courier` + `service` the courier does not offer for this parcel now.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            address:
              summary: Not one of my addresses
              value:
                error:
                  code: VALIDATION_FAILED
                  message: invalid request
                  details:
                    address_id: names none of your addresses
            service:
              summary: A service that is not offered
              value:
                error:
                  code: VALIDATION_FAILED
                  message: invalid request
                  details:
                    service: is not offered for this parcel now; choose one from GET /v1/checkout/shipping-quotes
    UpstreamUnavailable:
      description: The courier rates API did not answer in time (`APP_SHIPPING_TIMEOUT`), answered with a server error, or has failed so often that the API stopped asking it for a while (a circuit breaker, 30 seconds). Retry shortly.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: UPSTREAM_UNAVAILABLE
              message: the shipping rate service is not answering; try again shortly
    EmailUnverified:
      description: The caller has not verified their email address yet. Checkout needs it, so an account registered with someone else's address cannot order (`apps/api/SECURITY.md`); use `POST /v1/auth/verify-email/resend`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: EMAIL_UNVERIFIED
              message: verify your email address before placing an order
    OrderNotFound:
      description: No such order, or (for a buyer) another user's order, or an `id` that is not a UUID.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: NOT_FOUND
              message: order not found
    InvalidTransition:
      description: |
        The order's status does not allow this change (`INVALID_TRANSITION`, with the current `details.status` and the wanted `details.to`). The life cycle is pending_payment → paid → processing → shipped → completed, and cancelled from pending_payment, paid or processing (a buyer: pending_payment only). Two racing changes cannot both succeed: each is one conditional update.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: INVALID_TRANSITION
              message: the order cannot make this change in its current status
              details:
                status: shipped
                to: cancelled
    ShippingUnavailable:
      description: The shipping provider answered, and no courier serves the address's postal code (`SHIPPING_UNAVAILABLE`). Retrying does not help; choose another address. A provider that does not answer is 503 `UPSTREAM_UNAVAILABLE` instead.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: SHIPPING_UNAVAILABLE
              message: no courier serves this address; choose another address
    ValidationFailed:
      description: The body is not valid JSON or breaks the schema (`VALIDATION_FAILED`, one entry per field).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: VALIDATION_FAILED
              message: invalid request
              details:
                tracking_number: "must be the courier's airway bill: 6 to 40 letters, digits or hyphens"
