openapi: 3.1.0
info:
  title: GoShop API
  version: 0.1.0
  summary: The single REST API behind the GoShop storefront, admin dashboard and mobile app.
  description: |
    GoShop is the online store built in the Santekno Fullstack Course. This
    contract is written before the code: the API in `apps/api` (Bab 2+) must
    match it, and the web and mobile clients are typed from it.

    Conventions:
    - JSON everywhere, field names in `snake_case`.
    - Money is an integer amount of rupiah plus a currency, never a float.
    - Lists use cursor pagination: pass `page.next_cursor` back as `cursor`
      until it is `null`.
    - Every error uses the same body: `{"error":{"code","message","details"}}`,
      where `details` is optional. Unknown routes and wrong methods use it too
      (404 `NOT_FOUND`, 405 `METHOD_NOT_ALLOWED` with an `Allow` header): Bab 2
      sets chi's `NotFound` and `MethodNotAllowed` handlers to the same JSON
      error writer.
    - Any endpoint except the health probes may answer 503 `TIMEOUT` with the
      same body when a request runs past the server's time limit
      (`APP_REQUEST_TIMEOUT`, 15s by default). Retry later.
    - Text in a JSON body must be valid UTF-8 without NUL characters; a
      string that is not answers 400 `VALIDATION_FAILED`. One exception: a
      raw invalid UTF-8 byte inside a JSON string is accepted, because Go's
      JSON decoder replaces it with U+FFFD (the replacement character)
      before the API validates the value, so the stored text holds U+FFFD
      instead.
    - Every response carries `X-Request-ID`: the caller's value when it is
      1-128 characters of `A-Za-z0-9._:-`, otherwise a generated one. Quote
      it when reporting a problem; the server logs carry the same ID.
  license:
    name: MIT
    identifier: MIT
  contact:
    name: Santekno
    url: https://www.santekno.com/series/fullstack-goshop/
servers:
  - url: http://localhost:8080
    description: Local development (make up)
security: []
tags:
  - name: Health
    description: Liveness and readiness probes for Docker and Railway.
  - name: Catalog
    description: Public, read-only catalog for buyers. No authentication needed.
  - name: Auth
    description: |
      Accounts and tokens (Bab 4, design in ADR 0005). Passwords are hashed
      with argon2id and never logged or returned.
  - name: Me
    description: The logged-in user's own account. Every operation needs an access token.
  - name: Admin


    description: |
      Product management for the admin dashboard. Every operation needs an
      access token whose role is `seller` or `admin` (Bab 4): no token is
      401 `UNAUTHORIZED`, a `buyer` is 403 `FORBIDDEN`.

paths:
  /healthz:
    get:
      tags: [Health]
      operationId: getHealthz
      summary: Liveness probe
      description: Returns 200 while the process is running. It checks no dependencies, so a database outage does not restart the container.
      responses:
        "200":
          description: The process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
              example:
                status: ok
        "503":
          $ref: "#/components/responses/Unavailable"

  /readyz:
    get:
      tags: [Health]
      operationId: getReadyz
      summary: Readiness probe
      description: |
        Returns 200 when every readiness check passes, 503 otherwise. Load
        balancers stop sending traffic while it fails.

        Checks: `server` fails from the moment the API receives SIGTERM
        until it exits, so traffic drains before shutdown; `postgres` (Bab 3)
        fails while a ping through the connection pool fails or takes longer
        than 2s. Bab 4 adds `redis`. The probes run outside the request
        timeout, so they never answer 503 `TIMEOUT`.
      responses:
        "200":
          description: Every readiness check passes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
              example:
                status: ok
                checks:
                  server: { status: ok, duration_ms: 0 }
                  postgres: { status: ok, duration_ms: 1 }
        "503":
          $ref: "#/components/responses/Unavailable"

  /v1/categories:
    get:
      tags: [Catalog]
      operationId: listCategories
      summary: List categories
      description: Returns every category, parents before children, sorted by name. The list is small, so it is not paginated.
      responses:
        "200":
          description: All categories.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryList"
              example:
                data:
                  - id: 0192f3a0-1c2d-7b4e-8a10-3f5e6d7c8b90
                    slug: pakaian
                    name: Pakaian
                    parent_id: null
                  - id: 0192f3a0-1c2d-7b4e-8a10-3f5e6d7c8b91
                    slug: kaos
                    name: Kaos
                    parent_id: 0192f3a0-1c2d-7b4e-8a10-3f5e6d7c8b90
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/products:
    get:
      tags: [Catalog]
      operationId: listProducts
      summary: List and search products
      description: Returns active products, one page at a time. Filters can be combined. To get the next page, send the same filters plus `cursor` set to the previous `page.next_cursor`.
      parameters:
        - name: category
          in: query
          description: Category slug. Products in its child categories are included. A slug that names no category returns 400 `UNKNOWN_CATEGORY`, so a typo is not mistaken for an empty category.
          schema:
            type: string
            pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
            maxLength: 100
          example: kaos
        - name: q
          in: query
          description: |
            Search text, matched against product name and description with
            PostgreSQL full-text search (Indonesian stemming, so `dipakai`
            also finds `pakai`; a match in the name counts more). Accepts
            words, `"quoted phrases"`, `-excluded` words and `or`; it never
            fails on syntax. Combines with `category`, `sort` and `cursor`;
            results follow `sort`, not relevance. Text that is only spaces is
            no search.
          schema:
            type: string
            minLength: 1
            maxLength: 100
          example: kaos polos
        - name: sort
          in: query
          description: Sort order. Price sorting uses the cheapest sellable variant (`price_from`).
          schema:
            type: string
            enum: [newest, price_asc, price_desc]
            default: newest
        - name: cursor
          in: query
          description: Opaque cursor from `page.next_cursor` of the previous page. Omit it for the first page. Clients must not parse or build it; it is only valid with the same `category`, `q` and `sort`.
          schema:
            type: string
            maxLength: 512
        - name: limit
          in: query
          description: Page size.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: One page of products.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductList"
              example:
                data:
                  - id: 0192f3a1-5e6f-7a8b-9c0d-1e2f3a4b5c6d
                    slug: kaos-polos-hitam
                    name: Kaos Polos Hitam
                    description: Kaos katun combed 30s, nyaman dipakai sehari-hari.
                    category:
                      id: 0192f3a0-1c2d-7b4e-8a10-3f5e6d7c8b91
                      slug: kaos
                      name: Kaos
                      parent_id: 0192f3a0-1c2d-7b4e-8a10-3f5e6d7c8b90
                    price_from: { amount: 89000, currency: IDR }
                    in_stock: true
                    variants:
                      - id: 0192f3a1-5e6f-7a8b-9c0d-1e2f3a4b5c70
                        sku: KPH-M
                        name: M
                        price: { amount: 89000, currency: IDR }
                        stock: 12
                      - id: 0192f3a1-5e6f-7a8b-9c0d-1e2f3a4b5c71
                        sku: KPH-XL
                        name: XL
                        price: { amount: 99000, currency: IDR }
                        stock: 0
                    created_at: "2026-11-01T08:00:00Z"
                page:
                  next_cursor: eyJjIjoiMjAyNi0xMS0wMVQwODowMDowMFoiLCJpZCI6IjAxOTJmM2ExIn0
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/products/{slug}:
    get:
      tags: [Catalog]
      operationId: getProduct
      summary: Get one product
      description: Returns an active product with its sellable (non-archived) variants. A slug that does not match the slug pattern returns 404 `NOT_FOUND`, exactly like a slug that matches no product, so clients handle one case.
      parameters:
        - name: slug
          in: path
          required: true
          description: Product slug.
          schema:
            type: string
            pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
            maxLength: 200
          example: kaos-polos-hitam
      responses:
        "200":
          description: The product.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductDetail"
              example:
                data:
                  id: 0192f3a1-5e6f-7a8b-9c0d-1e2f3a4b5c6d
                  slug: kaos-polos-hitam
                  name: Kaos Polos Hitam
                  description: Kaos katun combed 30s, nyaman dipakai sehari-hari.
                  category:
                    id: 0192f3a0-1c2d-7b4e-8a10-3f5e6d7c8b91
                    slug: kaos
                    name: Kaos
                    parent_id: 0192f3a0-1c2d-7b4e-8a10-3f5e6d7c8b90
                  price_from: { amount: 89000, currency: IDR }
                  in_stock: true
                  variants:
                    - id: 0192f3a1-5e6f-7a8b-9c0d-1e2f3a4b5c70
                      sku: KPH-M
                      name: M
                      price: { amount: 89000, currency: IDR }
                      stock: 12
                  created_at: "2026-11-01T08:00:00Z"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/admin/products:
    post:
      tags: [Admin]
      operationId: createProduct
      security:
        - bearerAuth: []
      summary: Create a product with its variants
      description: |
        The product and its
        variants are stored in one transaction, and `price_from` is computed
        from the variants in the same transaction. SKUs are trimmed and
        upper-cased before they are stored. Variants must not carry an `id`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductWrite"
      responses:
        "201":
          description: The product was created.
          headers:
            Location:
              description: URL of the new product, `/v1/admin/products/{id}`.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminProductDetail"
        "400":
          $ref: "#/components/responses/BadWrite"
        "409":
          $ref: "#/components/responses/Conflict"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/admin/products/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Product ID. One that is not a UUID returns 404 `NOT_FOUND`.
        schema:
          type: string
          format: uuid
    get:
      tags: [Admin]
      operationId: getAdminProduct
      security:
        - bearerAuth: []
      summary: Get any product
      description: Returns the product whatever its status, with its sellable (non-archived) variants.
      responses:
        "200":
          description: The product.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminProductDetail"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      tags: [Admin]
      operationId: updateProduct
      security:
        - bearerAuth: []
      summary: Save a product and its variants
      description: |
        The body is the whole product, as an
        admin form sends it. A variant with an `id` (a sellable variant of
        this product) is updated, one without an `id` is added, and a
        sellable variant left out of the list is archived (kept for order
        history, never deleted; its SKU stays taken). Everything runs in one
        transaction that also recomputes `price_from`, and every variant
        update increments its internal `version`. Bab 5 adds an optimistic
        `version` check for stock edits; until then the last save wins.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductWrite"
      responses:
        "200":
          description: The saved product.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminProductDetail"
        "400":
          $ref: "#/components/responses/BadWrite"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags: [Admin]
      operationId: archiveProduct
      security:
        - bearerAuth: []
      summary: Archive a product
      description: |
        Sets the status to `archived`, which
        takes the product off the storefront. Nothing is deleted: orders
        keep pointing at the product and its variants, and saving it again
        with another status restores it. Archiving an archived product
        answers 204 as well.
      responses:
        "204":
          description: The product is archived.
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/auth/register:
    post:
      tags: [Auth]
      operationId: register
      summary: Create an account
      description: |
        Creates a `buyer` account. The email is trimmed and lower-cased, and
        must be plain ASCII. The password must be 8 to 128 characters and
        not one of the most common leaked passwords; there are no rules
        about digits or symbols (NIST SP 800-63B). Every invalid field is
        reported at once. The account can log in straight away; its email
        is unverified until the user confirms it with the token from the
        verification email (`/v1/auth/verify-email`).

        An email that already has an account answers 409 `EMAIL_TAKEN`.
        This tells a caller that the address is registered, a deliberate
        trade-off for a clear sign-up form; the endpoint is rate limited.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
            example:
              email: budi@example.com
              password: kopi-susu-gula-aren
              name: Budi Santoso
      responses:
        "201":
          description: The account was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserDetail"
        "400":
          $ref: "#/components/responses/BadAuthRequest"
        "409":
          $ref: "#/components/responses/EmailTaken"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Log in with email and password
      description: |
        Returns a short-lived access token (a JWT, `APP_ACCESS_TOKEN_TTL`,
        15 minutes by default) to send as `Authorization: Bearer <token>`.

        Every failure is 401 `INVALID_CREDENTIALS`: an unknown email, a
        wrong password, an account that signs in with Google only, and a
        deleted account all look the same, and take the same time (one
        argon2id verification each), so the endpoint does not reveal which
        emails have an account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            example:
              email: budi@example.com
              password: kopi-susu-gula-aren
      responses:
        "200":
          description: Logged in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPairDetail"
        "400":
          $ref: "#/components/responses/BadAuthRequest"
        "401":
          $ref: "#/components/responses/InvalidCredentials"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshTokens
      summary: Rotate the refresh token
      description: |
        Exchanges a refresh token for a new access token and a new refresh
        token of the same session. The presented refresh token never works
        again. Presenting one that was already rotated means someone else
        has a copy: the API revokes the whole session (every token issued
        since that login) and answers 401 `TOKEN_INVALID`, and the user logs
        in again. Clients must not refresh in parallel; keep one refresh in
        flight and let other requests wait for it.

        The access token carries the user's role as it is now, so a role
        change takes effect at the next refresh.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: New tokens.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPairDetail"
        "400":
          $ref: "#/components/responses/BadAuthRequest"
        "401":
          $ref: "#/components/responses/InvalidRefreshToken"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: End the session
      description: |
        Revokes the session of the refresh token: the refresh token and
        every access token of the session stop working. No access token is
        needed, so a client whose access token has expired can still log
        out. Answers 204 whether or not the token was still valid.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "204":
          description: The session is over.
        "400":
          $ref: "#/components/responses/BadAuthRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/me:
    get:
      tags: [Me]
      operationId: getMe
      summary: Get my account
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The caller's account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/auth/verify-email:
    post:
      tags: [Auth]
      operationId: verifyEmail
      summary: Confirm the email address
      description: |
        Uses the token from the verification email: the account's
        `email_verified` becomes true and the token stops working.
        Registration sends the first email; a token works for 24 hours, and
        only the newest one sent works.

        Until a mail provider arrives (Bab 6) the API does not send email:
        in development it writes the message, token included, to its log;
        elsewhere it logs only the subject.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenRequest"
      responses:
        "204":
          description: The email is verified.
        "400":
          $ref: "#/components/responses/BadEmailToken"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/auth/verify-email/resend:
    post:
      tags: [Auth]
      operationId: resendVerification
      summary: Send a new verification email
      description: Sends a new verification token to the caller's email; older tokens stop working. Does nothing when the email is verified already. Answers 202 either way.
      security:
        - bearerAuth: []
      responses:
        "202":
          description: A new email is on its way, or none was needed.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        The `access_token` from `/v1/auth/login` or `/v1/auth/refresh`, as
        `Authorization: Bearer <token>`. It lives 15
        minutes by default (ADR 0005); refresh it before or after it
        expires.

  schemas:
    Money:
      type: object
      description: An amount of money. Rupiah has no minor unit in practice, so `amount` is whole rupiah.
      required: [amount, currency]
      additionalProperties: false
      properties:
        amount:
          type: integer
          format: int64
          minimum: 0
          description: Whole rupiah. 89000 means Rp89.000.
          example: 89000
        currency:
          type: string
          const: IDR
          description: ISO 4217 currency code. Always IDR.

    Category:
      type: object
      required: [id, slug, name, parent_id]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
          pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
          maxLength: 100
          example: kaos
        name:
          type: string
          example: Kaos
        parent_id:
          type: [string, "null"]
          format: uuid
          description: Parent category, or `null` for a top-level category.

    ProductVariant:
      type: object
      description: One sellable item of a product (for example one size). Price and stock live here, not on the product.
      required: [id, sku, name, price, stock]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        sku:
          type: string
          description: Unique across the store, upper-case.
          example: KPH-M
        name:
          type: string
          example: M
        price:
          $ref: "#/components/schemas/Money"
        stock:
          type: integer
          minimum: 0
          description: Units available right now.

    Product:
      type: object
      required: [id, slug, name, description, category, price_from, in_stock, variants, created_at]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
          pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
          maxLength: 200
          example: kaos-polos-hitam
        name:
          type: string
          example: Kaos Polos Hitam
        description:
          type: string
        category:
          $ref: "#/components/schemas/Category"
        price_from:
          $ref: "#/components/schemas/Money"
          description: Price of the cheapest sellable (non-archived) variant.
        in_stock:
          type: boolean
          description: True when at least one sellable variant has stock. Computed per request, never stored.
        variants:
          type: array
          description: The sellable variants. Archived variants are never returned.
          minItems: 1
          items:
            $ref: "#/components/schemas/ProductVariant"
        created_at:
          type: string
          format: date-time

    ProductWrite:
      type: object
      description: A product as the admin writes it.
      required: [category_id, slug, name, status, variants]
      additionalProperties: false
      properties:
        category_id:
          type: string
          format: uuid
        slug:
          type: string
          pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
          maxLength: 200
          example: kaos-polos-hitam
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 5000
          default: ""
        status:
          type: string
          enum: [draft, active, archived]
          description: Only `active` products appear in the storefront.
        variants:
          type: array
          description: Every sellable variant of the product. SKUs must be unique within the list.
          minItems: 1
          maxItems: 50
          items:
            $ref: "#/components/schemas/VariantWrite"

    VariantWrite:
      type: object
      required: [sku, name, price, stock, weight_grams]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          description: An existing sellable variant of this product, to update it. Leave it out for a new variant, and always on create.
        sku:
          type: string
          minLength: 1
          maxLength: 64
          description: Trimmed and upper-cased by the API. Unique across the store, archived variants included.
          example: KPH-M
        name:
          type: string
          minLength: 1
          maxLength: 100
          example: M
        price:
          type: integer
          format: int64
          minimum: 1
          maximum: 1000000000
          description: Whole rupiah.
          example: 89000
        stock:
          type: integer
          minimum: 0
          maximum: 1000000
        weight_grams:
          type: integer
          minimum: 1
          maximum: 100000

    AdminVariant:
      type: object
      required: [id, sku, name, price, stock, weight_grams]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        sku:
          type: string
        name:
          type: string
        price:
          $ref: "#/components/schemas/Money"
        stock:
          type: integer
          minimum: 0
        weight_grams:
          type: integer
          minimum: 1

    AdminProduct:
      type: object
      description: A product as the admin sees it, in any status.
      required: [id, category_id, slug, name, description, status, price_from, variants, created_at, updated_at]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        category_id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [draft, active, archived]
        price_from:
          description: Price of the cheapest sellable variant, or `null` when the product has none.
          oneOf:
            - $ref: "#/components/schemas/Money"
            - type: "null"
        variants:
          type: array
          description: The sellable (non-archived) variants, cheapest first.
          items:
            $ref: "#/components/schemas/AdminVariant"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    AdminProductDetail:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          $ref: "#/components/schemas/AdminProduct"

    PageInfo:
      type: object
      required: [next_cursor]
      additionalProperties: false
      properties:
        next_cursor:
          type: [string, "null"]
          description: Cursor for the next page, or `null` on the last page. A page may hold fewer than `limit` products, even none, while `next_cursor` is not null; stop only when it is null.

    CategoryList:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Category"

    ProductList:
      type: object
      required: [data, page]
      additionalProperties: false
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Product"
        page:
          $ref: "#/components/schemas/PageInfo"

    ProductDetail:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          $ref: "#/components/schemas/Product"

    RegisterRequest:
      type: object
      required: [email, password, name]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          description: Trimmed and lower-cased by the API. ASCII only.
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 128
          description: Counted in characters. Never logged, never returned.
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Trimmed by the API.

    User:
      type: object
      description: An account as its owner and the auth endpoints see it.
      required: [id, email, name, phone, role, email_verified, created_at]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        phone:
          type: [string, "null"]
          description: An Indonesian phone number, or `null` when none is set.
        role:
          type: string
          enum: [buyer, seller, admin]
          description: What the user may do. New accounts are always `buyer`.
        email_verified:
          type: boolean
        created_at:
          type: string
          format: date-time

    UserDetail:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          $ref: "#/components/schemas/User"

    LoginRequest:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email:
          type: string
          maxLength: 254
          description: Trimmed and lower-cased before the lookup.
        password:
          type: string
          format: password
          maxLength: 1024

    TokenPair:
      type: object
      description: The tokens of a session (ADR 0005) and the account they belong to.
      required: [access_token, token_type, expires_in, refresh_token, refresh_expires_in, user]
      additionalProperties: false
      properties:
        access_token:
          type: string
          description: "A JWT. Send it as `Authorization: Bearer <access_token>`. Clients must not rely on its claims; they may change."
        token_type:
          type: string
          const: Bearer
        expires_in:
          type: integer
          minimum: 0
          description: Seconds until the access token expires.
        refresh_token:
          type: string
          description: Opaque; send it to `/v1/auth/refresh` and `/v1/auth/logout`. Keep it in the platform's secure store (mobile); never in `localStorage`. Shown once, stored by the API only as a hash.
        refresh_expires_in:
          type: integer
          minimum: 0
          description: Seconds until the refresh token expires (`APP_REFRESH_TOKEN_TTL`, 30 days by default). Every refresh starts a new period.
        user:
          $ref: "#/components/schemas/User"


    TokenPairDetail:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          $ref: "#/components/schemas/TokenPair"

    RefreshRequest:
      type: object
      required: [refresh_token]
      additionalProperties: false
      properties:
        refresh_token:
          type: string
          maxLength: 200
          description: The `refresh_token` of the last login or refresh.

    TokenRequest:
      type: object
      required: [token]
      additionalProperties: false
      properties:
        token:
          type: string
          maxLength: 200
          description: The token from the email, exactly as sent.

    HealthCheck:
      type: object
      required: [status, duration_ms]
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [ok, unavailable]
        error:
          type: string
          description: Why the check failed. Present only when `status` is `unavailable` and the server runs in development; elsewhere the API sets `healthx.Handler.HideErrors`, which drops the text (it can contain internal addresses) from the response. `healthx` itself does not log it; GoShop's own check wrappers log the error before returning it (Bab 2).
        duration_ms:
          type: integer
          minimum: 0

    HealthStatus:
      type: object
      description: Health probe body, as written by santekno/sdk `healthx` (v0.2.0 sends it as `application/json`). Probes use this body for 503 too, not the `Error` body.
      required: [status]
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [ok, unavailable]
        checks:
          type: object
          description: One entry per dependency check, keyed by its name. Omitted when there are no checks.
          additionalProperties:
            $ref: "#/components/schemas/HealthCheck"

    Error:
      type: object
      description: The only error body the API returns (except health probes). It is what `DefaultErrorWriter` in santekno/sdk `middleware/chi` (v0.2.0) writes from an `errx.AppError`; `details` is omitted when the error has none.
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: object
          required: [code, message]
          additionalProperties: false
          properties:
            code:
              type: string
              pattern: "^[A-Z][A-Z0-9_]*$"
              description: Machine-readable, SCREAMING_SNAKE_CASE. Clients branch on this, never on `message`.
              example: NOT_FOUND
            message:
              type: string
              description: Human-readable and safe to show; never contains internals.
              example: product not found
            details:
              type: object
              description: Optional structured context, for example which fields failed validation.
              additionalProperties: true

  responses:
    BadRequest:
      description: A query parameter is invalid (including a `cursor` the API did not make for the same `category`, `q` and `sort`), or `category` names no category.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            validationFailed:
              summary: A parameter is out of range
              value:
                error:
                  code: VALIDATION_FAILED
                  message: invalid query parameters
                  details:
                    limit: must be between 1 and 100
            unknownCategory:
              summary: The category slug does not exist
              value:
                error:
                  code: UNKNOWN_CATEGORY
                  message: category not found
                  details:
                    category: sepatu
            invalidCursor:
              summary: The cursor is not from page.next_cursor for these filters
              value:
                error:
                  code: VALIDATION_FAILED
                  message: invalid query parameters
                  details:
                    cursor: is not a cursor from page.next_cursor for these filters; start again without it
    BadWrite:
      description: The body is not valid JSON or breaks the schema (`VALIDATION_FAILED`, with one entry per field such as `variants[0].price`), or `category_id` names no category (`UNKNOWN_CATEGORY`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            validationFailed:
              summary: Fields break the schema
              value:
                error:
                  code: VALIDATION_FAILED
                  message: invalid request
                  details:
                    slug: must be lower-case letters and digits in words joined by single hyphens
                    variants[0].price: must be between 1 and 1000000000
            unknownCategory:
              summary: The category does not exist
              value:
                error:
                  code: UNKNOWN_CATEGORY
                  message: category not found
                  details:
                    category_id: names no category
    Conflict:
      description: |
        Another product already has the slug (`SLUG_TAKEN`), or a variant anywhere in the store, archived ones included, already has one of the SKUs (`SKU_TAKEN`).

        Known Bab 3 limitation: within one save, each variant's SKU is checked when that variant is written, so swapping the SKUs of two variants, or giving one variant the SKU another variant of the same product has right now, answers 409 `SKU_TAKEN`. Save twice instead, through a temporary SKU.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            slugTaken:
              summary: The slug is in use
              value:
                error:
                  code: SLUG_TAKEN
                  message: another product already uses this slug
                  details:
                    slug: another product already uses this slug
            skuTaken:
              summary: A SKU is in use
              value:
                error:
                  code: SKU_TAKEN
                  message: a variant with one of these SKUs already exists
                  details:
                    variants: a variant with one of these SKUs already exists
    NotFound:
      description: The resource does not exist, is not active, or its slug is malformed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: NOT_FOUND
              message: product not found
    BadAuthRequest:
      description: The body is not valid JSON or breaks the schema (`VALIDATION_FAILED`, one entry per field). A password that breaks the policy is reported under `password`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: VALIDATION_FAILED
              message: invalid request
              details:
                email: must be an email address such as budi@example.com
                password: must be between 8 and 128 characters
    EmailTaken:
      description: Another account already uses this email.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: EMAIL_TAKEN
              message: an account with this email already exists
              details:
                email: is already registered; log in or reset the password

    InvalidCredentials:
      description: The email and password do not match an account. The same answer for every reason, so it does not reveal whether the email is registered.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: INVALID_CREDENTIALS
              message: email or password is incorrect

    InvalidRefreshToken:
      description: The refresh token is malformed, unknown, revoked, already used (`TOKEN_INVALID`; a reused token also revokes its session), or expired (`TOKEN_EXPIRED`). Either way the user logs in again.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            invalid:
              summary: Unknown, revoked or reused
              value:
                error:
                  code: TOKEN_INVALID
                  message: the token is invalid or has been revoked; log in again
            expired:
              summary: Expired
              value:
                error:
                  code: TOKEN_EXPIRED
                  message: the token has expired; log in again

    Unauthorized:
      description: |
        No valid access token: the `Authorization` header is missing or not
        `Bearer <token>`, or the token is malformed, expired, signed with
        another key, revoked (its session was logged out or ended), or its
        account was deleted. The response carries
        `WWW-Authenticate: Bearer realm="goshop"`. The code is always
        `UNAUTHORIZED` (sdk `JWTAuth` does not tell an expired token from a
        bad one), so a client refreshes once and retries; if the refresh
        fails, the user logs in again.
      headers:
        WWW-Authenticate:
          description: Always `Bearer realm="goshop"`.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: UNAUTHORIZED
              message: invalid or expired token

    Forbidden:
      description: The caller is logged in, but their role may not do this. Admin endpoints need `seller` or `admin`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: FORBIDDEN
              message: your role is not allowed to do this

    BadEmailToken:
      description: The body is invalid (`VALIDATION_FAILED`), or the token from the email cannot be used. `TOKEN_INVALID` means it is malformed, unknown, already used, replaced by a newer email, or its account was deleted; `TOKEN_EXPIRED` means it is too old. Ask for a new email either way.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            invalid:
              summary: Unknown or used
              value:
                error:
                  code: TOKEN_INVALID
                  message: the token is invalid or has already been used
            expired:
              summary: Too old
              value:
                error:
                  code: TOKEN_EXPIRED
                  message: the token has expired; ask for a new email

    InternalError:
      description: Unexpected server error. The code is always `INTERNAL_ERROR`, the code sdk `middleware/chi` `Recovery` writes after a panic, and handlers use the same code for every other 500. The details are in the server log, never in the response.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: INTERNAL_ERROR
              message: internal server error
    Unavailable:
      description: The process or one of its dependencies is not healthy.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/HealthStatus"
          example:
            status: unavailable
            checks:
              postgres: { status: unavailable, duration_ms: 3 }
              redis: { status: ok, duration_ms: 1 }
