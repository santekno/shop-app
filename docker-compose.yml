# Full GoShop stack for local development and the verified gate.
# Dependencies (Postgres + pgvector, Redis, SeaweedFS S3) run from the start; app services are added by the chapter
# that introduces them (api: Bab 2, worker: Bab 6, web: Bab 7, admin: Bab 12),
# each built from its own Dockerfile with the repo root as context, the same
# way Railway builds them.

# The api and the worker are two binaries of one Go module and read the
# same configuration (docs/configuration.md); each adds its own port.
# Values below are local defaults; a .env file next to this one overrides
# them.
x-app-environment: &app-environment
  APP_ENV: ${APP_ENV:-development}
  APP_LOG_LEVEL: ${APP_LOG_LEVEL:-info}
  APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:5173}
  APP_REQUEST_TIMEOUT: ${APP_REQUEST_TIMEOUT:-15s}
  APP_DRAIN_DELAY: ${APP_DRAIN_DELAY:-0s}
  APP_SHUTDOWN_TIMEOUT: ${APP_SHUTDOWN_TIMEOUT:-10s}
  # Inside the Compose network the database host is "postgres", so this
  # is not taken from .env, whose DATABASE_URL is for tools on the host.
  DATABASE_URL: postgres://goshop:goshop@postgres:5432/goshop?sslmode=disable
  APP_DB_MAX_OPEN_CONNS: ${APP_DB_MAX_OPEN_CONNS:-10}
  APP_DB_MAX_IDLE_CONNS: ${APP_DB_MAX_IDLE_CONNS:-5}
  APP_DB_CONN_MAX_LIFETIME: ${APP_DB_CONN_MAX_LIFETIME:-30m}
  # Inside the Compose network Redis is "redis", like postgres above.
  REDIS_URL: redis://redis:6379/0
  APP_TRUSTED_PROXY_HOPS: ${APP_TRUSTED_PROXY_HOPS:-0}
  # The .env.example placeholder, which the API accepts only when
  # APP_ENV=development; set a real JWT_SECRET in .env for anything else.
  JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-string}
  APP_ACCESS_TOKEN_TTL: ${APP_ACCESS_TOKEN_TTL:-15m}
  APP_REFRESH_TOKEN_TTL: ${APP_REFRESH_TOKEN_TTL:-720h}
  # Empty: Google sign-in is off (allowed in development only).
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  # Empty: shipping is priced from the fixed table, no network.
  BITESHIP_API_KEY: ${BITESHIP_API_KEY:-}
  APP_SHIPPING_ORIGIN_POSTAL_CODE: ${APP_SHIPPING_ORIGIN_POSTAL_CODE:-40111}
  APP_SHIPPING_TIMEOUT: ${APP_SHIPPING_TIMEOUT:-5s}
  APP_PAYMENT_TTL: ${APP_PAYMENT_TTL:-24h}
  # Raised only for the k6 load test (e2e/k6): APP_CHECKOUT_LIMIT_PER_MINUTE=100000 make up
  APP_CHECKOUT_LIMIT_PER_MINUTE: ${APP_CHECKOUT_LIMIT_PER_MINUTE:-30}
  # fake: pay locally with `make fake-pay order=GS-…`, no Midtrans account
  # needed. Set midtrans (and the sandbox keys below) to use Snap; the API
  # refuses fake when APP_ENV=production.
  APP_PAYMENT_PROVIDER: ${APP_PAYMENT_PROVIDER:-fake}
  # Midtrans sandbox keys from .env; empty turns payments off.
  MIDTRANS_SERVER_KEY: ${MIDTRANS_SERVER_KEY:-}
  MIDTRANS_CLIENT_KEY: ${MIDTRANS_CLIENT_KEY:-}
  MIDTRANS_IS_PRODUCTION: "false"
  APP_PAYMENT_TIMEOUT: ${APP_PAYMENT_TIMEOUT:-10s}
  # The storefront Snap sends buyers back to (<web>/pembayaran/selesai).
  APP_WEB_URL: ${APP_WEB_URL:-http://localhost:5173}
  # Image storage (ADR 0007). The API reaches SeaweedFS as "storage";
  # browsers upload to, and read images from, localhost:8333, so the
  # presigned URLs are signed for that host.
  S3_ENDPOINT: http://storage:8333
  S3_PRESIGN_ENDPOINT: http://localhost:8333
  S3_BUCKET: ${S3_BUCKET:-goshop}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:-goshop}
  S3_SECRET_KEY: ${S3_SECRET_KEY:-goshop-secret}
  # Empty: emails go to the log (docs/configuration.md shows Mailpit).
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USERNAME: ${SMTP_USERNAME:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_FROM: ${SMTP_FROM:-GoShop <no-reply@goshop.local>}
  # Empty: no Telegram message to the seller.
  TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
  TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: goshop
      POSTGRES_PASSWORD: goshop
      POSTGRES_DB: goshop
    # All ports bind to 127.0.0.1: these dev services use fixed credentials and must not be reachable from the network.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U goshop -d goshop"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # S3-compatible object storage (local stand-in for any S3 bucket in production).
  # Local-only credentials; the API talks plain S3, so production swaps the endpoint.
  storage:
    image: chrislusf/seaweedfs:4.48
    command: server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    ports:
      - "127.0.0.1:8333:8333"
    volumes:
      - storagedata:/data
      - ./deploy/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8333/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30

  # Applies the database migrations once and exits (Bab 3): the api image
  # running `api migrate`, the same command Railway runs before each deploy.
  # The api waits for it to finish successfully; the server never migrates.
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["migrate"]
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_LOG_LEVEL: ${APP_LOG_LEVEL:-info}
      # The host is the Compose service name, not localhost, so this is not
      # taken from .env (whose DATABASE_URL is for tools on your machine).
      DATABASE_URL: postgres://goshop:goshop@postgres:5432/goshop?sslmode=disable
      # `api migrate` validates the whole configuration like the server
      # does (Railway's pre-deploy command runs with the api's variables),
      # so it gets the same required values, though it uses none of them.
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-string}
      # Required outside development, like for the api below: without them
      # a compose run with APP_ENV=staging would stop here, at migrate.
      APP_TRUSTED_PROXY_HOPS: ${APP_TRUSTED_PROXY_HOPS:-0}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      BITESHIP_API_KEY: ${BITESHIP_API_KEY:-}
      APP_SHIPPING_ORIGIN_POSTAL_CODE: ${APP_SHIPPING_ORIGIN_POSTAL_CODE:-40111}
      # `api migrate` also creates the image bucket when it is missing.
      S3_ENDPOINT: http://storage:8333
      S3_BUCKET: ${S3_BUCKET:-goshop}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-goshop}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-goshop-secret}
    depends_on:
      postgres:
        condition: service_healthy
      storage:
        condition: service_healthy
    restart: "no"

  # GoShop API (Bab 2). Built from its Dockerfile with the repo root as context,
  # like Railway. It starts once postgres and redis are healthy and the
  # migrate service has finished. Values below are local defaults; a .env file next to this
  # one overrides them.
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *app-environment
      APP_PORT: "8080"
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      # distroless has no curl or wget; the binary probes its own /healthz.
      test: ["CMD", "/api", "healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    # Room for drain delay + shutdown timeout before Docker sends SIGKILL.
    stop_grace_period: 30s

  # GoShop worker (Bab 6, ADR 0007): Asynq tasks from Redis, the scheduled
  # jobs and the outbox's emails and messages. Built from its own
  # Dockerfile, like Railway. No published port: only its health check
  # talks to it.
  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.worker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      storage:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *app-environment
      APP_PORT: "8081"
      APP_WORKER_CONCURRENCY: ${APP_WORKER_CONCURRENCY:-5}
    healthcheck:
      test: ["CMD", "/worker", "healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    # Room for running tasks to finish (APP_SHUTDOWN_TIMEOUT).
    stop_grace_period: 30s

  # GoShop storefront: the Next.js standalone server (Bab 11 artikel 14;
  # Bab 7–10 served a Vite build with Caddy). It reaches the API twice:
  # - the browser, at NEXT_PUBLIC_API_URL, baked in at build time: the API
  #   as the *host* sees it, so localhost, not the service name;
  # - the server (server components, the sitemap), at API_INTERNAL_URL:
  #   the service name on the Compose network.
  # Published on 5173, the same origin as `pnpm dev` and the one the API's
  # CORS default allows: run one of the two at a time.
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    environment:
      PORT: "8080"
      API_INTERNAL_URL: http://api:8080
      # The storefront's public origin, for canonical links, Open Graph and
      # the sitemap (artikel 10–11).
      SITE_URL: ${SITE_URL:-http://localhost:5173}
      # Where the browser loads product photos from: the storage as the
      # host sees it, the S3_PRESIGN_ENDPOINT above (artikel 12).
      IMAGE_ORIGIN: http://localhost:8333
      # Empty: no analytics (artikel 13).
      GA_MEASUREMENT_ID: ${GA_MEASUREMENT_ID:-}
    depends_on:
      # Pages are rendered from the API's data: without it, every product
      # page is an error.
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:5173:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
  storagedata:
