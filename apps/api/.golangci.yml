# golangci-lint v2 config for the GoShop API. Run: make lint
# The standard set plus linters that catch real bugs in HTTP and SQL code;
# no style-only linters, so a finding is always worth reading.
version: "2"

run:
  # Lint the integration tests (apps/api/tests) as well.
  build-tags:
    - integration

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose # an unclosed response body leaks a connection
    - contextcheck # a function that has a context must pass it on
    - errorlint # compare wrapped errors with errors.Is / errors.As
    - gosec # unsafe patterns, e.g. a server without ReadHeaderTimeout
    - misspell
    - noctx # outgoing HTTP requests must carry a context
    - nolintlint # every //nolint names a linter and says why
    - revive # exported identifiers are documented
    - sqlclosecheck # rows and statements are closed (from Bab 3)
    - unconvert
    - wrapcheck # errors from other packages get context before they travel up
  settings:
    misspell:
      # Indonesian words in seed data and copy, not typos of English ones.
      ignore-rules:
        - teh
    nolintlint:
      require-explanation: true
      require-specific: true
    revive:
      rules:
        - name: exported
        - name: package-comments
        - name: unused-parameter
    staticcheck:
      checks:
        # The defaults (all but a few style checks) ...
        - all
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
        # ... minus S1016: response structs are filled field by field on
        # purpose, so a model change cannot silently change the JSON.
        - -S1016
    wrapcheck:
      ignore-sigs:
        # Errors that are already the API's own type, or that the caller
        # inspects directly, need no extra wrapping.
        - .Errorf(
        - errors.New(
        - errors.Unwrap(
        - errors.Join(
        - errx.New(
        - errx.Wrap(
        - .Wrap(
        - .Wrapf(
        - .WithDetail(
        - .WithDetails(
        - .WithHTTPStatus(
        # ctx.Err() is context.Canceled or DeadlineExceeded; callers match it
        # with errors.Is, and wrapping adds nothing.
        - .Err()
  exclusions:
    presets:
      - std-error-handling

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/santekno/shop-app
