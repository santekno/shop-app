<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="description"
      content="GoShop: toko online contoh dari kursus Fullstack Santekno."
    />
    <!-- Both themes are supported: before the CSS arrives, the browser
         paints the page in the device's scheme, not always white. -->
    <meta name="color-scheme" content="light dark" />
    <title>GoShop</title>
    <!-- The saved theme, applied before the first paint. A plain script
         (no type="module", no defer) blocks rendering for the few lines it
         runs; see public/theme.js for why it is a file, not inline. -->
    <script src="/theme.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
